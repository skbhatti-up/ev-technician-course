<h4>Basic CAN checks with a multimeter</h4>
<div class="tw"><table>
<thead><tr><th>Test</th><th>Good result</th><th>Meaning if wrong</th></tr></thead>
<tbody>
<tr><td>Resistance between CAN-H and CAN-L, 12 V battery disconnected</td><td>About <b>60 Ω</b></td><td>120 Ω → one terminating resistor or part of the bus is open. Near 0 Ω → wires shorted together.</td></tr>
<tr><td>Voltage CAN-H to earth, ignition on</td><td>About 2.5–3.5 V</td><td>0 V or 12 V → short to earth or to supply</td></tr>
<tr><td>Voltage CAN-L to earth, ignition on</td><td>About 1.5–2.5 V</td><td>As above</td></tr>
</tbody></table></div>
<p>At the <b>OBD socket</b> (16 pins, under the dashboard): pin 16 is battery positive, pins 4 and 5 are earth, pins 6 and 14 are CAN-High and CAN-Low. This is where the scan tool connects.</p>
<p>A fault code beginning with <b>U</b> (for example U0100, "lost communication with…") means a control unit is not being heard on the network. Check its power supply, earth and connectors before condemning the unit itself.</p>

<h3>16.4 Software, coding and calibration</h3>
<ul>
<li><b>Software updates.</b> Makers fix faults and add features by updating software, at the dealer or "over the air" (OTA). Some customer complaints are cured only by an update.</li>
<li><b>Coding and pairing.</b> Many replacement parts (BMS, inverter, charger, even 12 V batteries on some cars) must be registered to the car with a scan tool before they will work.</li>
<li><b>Calibration.</b> After replacing or disturbing certain parts you must run a learning routine: resolver angle offset after motor work, steering angle sensor after alignment, brake pedal sensor, and so on.</li>
<li><b>Driver assistance (ADAS).</b> Front cameras and radars for automatic braking and lane keeping need re-calibration after windscreen replacement, bumper repair, suspension or alignment work.</li>
</ul>
<aside class="c tip"><h4>Workshop tip</h4><p>Learn to read <b>wiring diagrams</b>. They are the map for every electrical fault. Start by tracing simple circuits (a horn, a brake light) until the symbols for fuses, relays, earths, connectors and splices are familiar. This one skill separates a diagnostician from a parts-changer.</p></aside>

<h3>16.5 Reading the instrument panel</h3>
<p>The dashboard is the car's first report. Always ask the customer which lights and messages appeared, or look for yourself, before connecting the scan tool. Symbols differ a little between makers, but the <b>colours</b> follow one rule everywhere.</p>

<ul>
<li><b>READY</b> replaces engine noise. A car showing READY will move if the accelerator is touched.</li>
<li>The <b>power gauge</b> replaces the rev counter: it swings one way for power used and the other way for regeneration.</li>
<li>Many cars show <b>SOC in %</b>, estimated range, and average consumption in kWh per 100 km. Note these on the job card.</li>
<li>A red light together with a <b>text message</b> ("Stop safely", "Check EV system") is the car's own summary of the fault. Write it down word for word.</li>
</ul>

<aside class="c sum"><h4>Summary</h4><ul>
<li>The 12 V battery wakes the car and closes the contactors. Check it first.</li>
<li>Added accessories often cause drains and network faults.</li>
<li>Control units share data on CAN bus: two wires, about 60 Ω between them.</li>
<li>"U" codes are communication faults: check power, earth and wiring first.</li>
<li>Modern repair includes software updates, coding and calibration.</li></ul></aside>

<div class="quiz"><h3>Quiz 16</h3><p>Choose one answer for each question.</p><ol>
<li>An EV with a fully charged HV battery is completely dead. What is the most likely cause?<ul><li>Failed motor</li><li>Worn tyres</li><li data-c>Flat 12 V battery</li><li>Low brake fluid</li></ul></li>
<li>What charges the 12 V battery in an EV?<ul><li>An alternator</li><li data-c>The DC-DC converter</li><li>The inverter</li><li>Regenerative braking directly</li></ul></li>
<li>What resistance should you measure between CAN-H and CAN-L with the battery disconnected?<ul><li>0 Ω</li><li data-c>About 60 Ω</li><li>120 Ω</li><li>1 MΩ</li></ul></li>
<li>Which control unit decides how much torque to request from the motor?<ul><li>BCM</li><li>BMS</li><li data-c>VCU</li><li>EPS</li></ul></li>
<li>A fault code U0100 "lost communication" is stored. What do you check first?<ul><li>Replace the control unit immediately</li><li data-c>The unit's power supply, earth and connectors</li><li>Tyre pressures</li><li>The motor windings</li></ul></li>
<li>What is an acceptable parked current drain on the 12 V battery after the car has gone to sleep?<ul><li>5 A</li><li>1 A</li><li data-c>Less than about 50 mA</li><li>500 mA</li></ul></li>
</ol></div>

<h4>Rules that prevent accidents</h4>
<ul>
<li><b>Check the CAT rating.</b> For vehicle high voltage use CAT III 1,000 V (or CAT IV 600 V). Cheap unrated meters can explode in your hand on a high-energy circuit.</li>
<li><b>Leads in the right sockets.</b> If the red lead is left in the amps (A) socket and you touch it across a voltage, the meter is a dead short. On an HV battery this causes an arc flash. Many technicians tape over the amps sockets on their HV meter and use a clamp for current.</li>
<li><b>Select the function before you connect.</b> DC volts for batteries; AC volts for mains.</li>
<li><b>Never measure resistance on a live circuit.</b></li>
<li><b>Inspect the leads</b> every time. Use leads with shrouded plugs and finger guards.</li>
<li><b>One hand where possible.</b> Clip one lead on, then probe with one hand, so current cannot pass hand to hand across your chest.</li>
</ul>

<h3>17.3 The insulation tester</h3>
<p>A multimeter measures resistance using a few volts. Damaged insulation can look perfect at 3 V and break down at 400 V. An <b>insulation tester</b> (megohmmeter, often called a "megger") applies <b>500 V or 1,000 V DC</b> at a tiny, safe current and measures resistance in megohms.</p>

<ul>
<li>Used only on components that are <b>isolated, disconnected and proven dead</b>, following the manual. Sensitive electronics may need to be unplugged first.</li>
<li>Healthy parts normally read tens or hundreds of megohms. The service manual gives the minimum acceptable value.</li>
<li>The tester's output is itself high voltage. Keep hands clear and let it discharge the part before removing the leads.</li>
<li><b>Never</b> use an insulation tester across battery cells or on live circuits.</li>
</ul>

<h3>17.4 The scan tool</h3>
<p>The scan tool plugs into the OBD socket and talks to every control unit. It is your window into the car.</p>
<div class="tw"><table>
<thead><tr><th>Function</th><th>What it gives you</th></tr></thead>
<tbody>
<tr><td><b>Read / clear DTCs</b></td><td>Fault codes from every module, with status (current, stored, pending)</td></tr>
<tr><td><b>Freeze-frame data</b></td><td>A snapshot of conditions at the moment a fault was recorded</td></tr>
<tr><td><b>Live data</b></td><td>Real-time values: cell voltages, temperatures, currents, insulation resistance, contactor states</td></tr>
<tr><td><b>Actuator tests</b></td><td>Command pumps, fans, valves and contactors on and off to test them</td></tr>
<tr><td><b>Service functions</b></td><td>Brake service mode, coolant bleed, resolver learning, battery registration, coding</td></tr>
</tbody></table></div>
<div class="tw"><table>
<caption>Table 17.2 — Live data worth learning</caption>
<thead><tr><th>Value</th><th>Healthy sign</th></tr></thead>
<tbody>
<tr><td>Cell voltage maximum / minimum</td><td>Small difference at rest (a few hundredths of a volt or less)</td></tr>
<tr><td>Battery temperature maximum / minimum</td><td>Within a few degrees of each other</td></tr>
<tr><td>SOC and SOH</td><td>SOH appropriate for age</td></tr>
<tr><td>Insulation resistance</td><td>High (hundreds of kΩ to MΩ); stable</td></tr>
<tr><td>Pack voltage vs inverter input voltage</td><td>Equal when contactors are closed</td></tr>
<tr><td>12 V system voltage in READY</td><td>13.5–14.8 V</td></tr>
<tr><td>Motor, inverter and coolant temperatures</td><td>Stable under load</td></tr>
</tbody></table></div>
<aside class="c tip"><h4>Workshop tip — choosing a scan tool</h4><p>A cheap Bluetooth OBD reader shows only basic engine codes. For EV work you need a tool that reads <b>all modules</b> on the brands you service. Check coverage for Chinese brands (BYD, Changan/Deepal, MG, GWM, Chery) before buying; it varies a lot between tool makers and software versions. For older Toyota hybrids, Toyota's own software (Techstream) with a suitable interface is very capable.</p></aside>

<h3>17.5 Component tests you will meet in training</h3>
<p>These are standard exercises in hands-on courses. All high-voltage parts are tested only when isolated and proven dead.</p>

<h4>Oscilloscope and CAN tools</h4>
<ul>
<li>A multimeter shows one number. An <b>oscilloscope</b> draws voltage against time, so you can see signals that change thousands of times a second: resolver outputs, CAN messages, the control pilot's square wave, sensor signals.</li>
<li>A <b>CAN interface</b> (training centres often use one called PCAN) connects a laptop to the bus and lists every message with its label and data. Decoding messages is advanced work, but simply seeing whether a unit is transmitting at all is a powerful test.</li>
</ul>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Start with a CAT III 1,000 V meter, a capable scan tool and a 12 V battery tester.</li>
<li>Voltage: across. Current: clamp around one wire. Resistance: power off.</li>
<li>Wrong lead socket + high voltage = arc flash.</li>
<li>An insulation tester finds faults a multimeter cannot see.</li>
<li>Live data — especially cell voltage spread and insulation resistance — is the heart of EV diagnosis.</li></ul></aside>

<div class="quiz"><h3>Quiz 17</h3><p>Choose one answer for each question.</p><ol>
<li>What rating should a multimeter have for vehicle high-voltage work?<ul><li>CAT I 300 V</li><li>Any rating</li><li data-c>CAT III 1,000 V</li><li>12 V automotive only</li></ul></li>
<li>How is a voltmeter connected?<ul><li>In series with the load</li><li data-c>Across (in parallel with) the part being measured</li><li>Around the wire</li><li>To earth only</li></ul></li>
<li>What happens if you measure voltage with the red lead in the amps socket?<ul><li>The reading is slightly low</li><li>Nothing</li><li data-c>The meter becomes a short circuit — possible arc flash</li><li>The battery charges</li></ul></li>
<li>Why is an insulation tester needed as well as a multimeter?<ul><li>It is cheaper</li><li data-c>It tests insulation at high voltage, revealing faults that do not show at a few volts</li><li>It measures current</li><li>It reads fault codes</li></ul></li>
<li>Which scan-tool function shows cell voltages in real time?<ul><li>Clear DTCs</li><li>Freeze frame</li><li data-c>Live data</li><li>Coding</li></ul></li>
<li>Before using an insulation tester on a component, the component must be…<ul><li>hot</li><li>connected to the battery</li><li data-c>isolated, disconnected and proven dead</li><li>charging</li></ul></li>
</ol></div>

<div class="mh"><div class="n">18</div><div><div class="pt">Part G · In the workshop</div><h2>Fault finding</h2><p>A method for diagnosis, how to read fault codes, and six real-world cases.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>A step-by-step diagnostic method</li>
<li>How fault codes are structured</li>
<li>How to approach the most common EV and hybrid complaints</li>
<li>When to stop and refer the job</li></ul></div>

<h3>18.1 The method</h3>
<figure>
<svg viewBox="0 0 720 230" role="img" aria-label="Eight-step diagnostic method">
<g class="gb"><rect x="20" y="20" width="150" height="74" rx="8"/><rect x="198" y="20" width="150" height="74" rx="8"/><rect x="376" y="20" width="150" height="74" rx="8"/><rect x="554" y="20" width="150" height="74" rx="8"/></g>
<g class="yb"><rect x="554" y="136" width="150" height="74" rx="8"/><rect x="376" y="136" width="150" height="74" rx="8"/><rect x="198" y="136" width="150" height="74" rx="8"/><rect x="20" y="136" width="150" height="74" rx="8"/></g>
<g class="m bd"><text x="95" y="46">1 · Listen</text><text x="273" y="46">2 · Confirm</text><text x="451" y="46">3 · Basics first</text><text x="629" y="46">4 · Scan</text>
<text x="629" y="162">5 · Research</text><text x="451" y="162">6 · Test and prove</text><text x="273" y="162">7 · Repair</text><text x="95" y="162">8 · Verify</text></g>
<g class="m s"><text x="95" y="64">What, when, how often?</text><text x="95" y="78">After any repair or accident?</text>
<text x="273" y="64">See the fault yourself</text><text x="273" y="78">Warning lights, messages</text>
<text x="451" y="64">12 V battery, fuses,</text><text x="451" y="78">coolant, leaks, damage</text>
<text x="629" y="64">All modules. Save codes</text><text x="629" y="78">and freeze-frame data</text>
<text x="629" y="180">Manual, wiring diagram,</text><text x="629" y="194">known issues</text>
<text x="451" y="180">Measure. Find the cause,</text><text x="451" y="194">not just the symptom</text>
<text x="273" y="180">Safely, with correct</text><text x="273" y="194">parts and procedure</text>
<text x="95" y="180">Clear codes, road test,</text><text x="95" y="194">re-scan, explain to owner</text></g>
<path d="M170 57 H194" class="ln" marker-end="url(#a)"/><path d="M348 57 H372" class="ln" marker-end="url(#a)"/><path d="M526 57 H550" class="ln" marker-end="url(#a)"/><path d="M629 94 V132" class="ln" marker-end="url(#a)"/><path d="M554 173 H530" class="ln" marker-end="url(#a)"/><path d="M376 173 H352" class="ln" marker-end="url(#a)"/><path d="M198 173 H174" class="ln" marker-end="url(#a)"/>
</svg>
<figcaption><b>Figure 18.1</b> The diagnostic method. Skipping steps is how parts get replaced for nothing.</figcaption></figure>
<aside class="c"><h4>Key idea</h4><p><b>A fault code is a clue, not a verdict.</b> The code tells you which circuit or value the computer is unhappy with. It does not tell you which part to replace. "Battery over-temperature" might be the battery — or a blocked fan, a failed pump, low refrigerant, or a faulty sensor. Your job is to prove which.</p></aside>

<h3>18.2 Reading fault codes</h3>
<p>Standard diagnostic trouble codes (DTCs) have a letter and four characters.</p>
<div class="tw"><table>
<thead><tr><th>First letter</th><th>System</th><th>Examples</th></tr></thead>
<tbody>
<tr><td><b>P</b></td><td>Powertrain (includes HV battery, motor, inverter, charging)</td><td>P0A80 — replace hybrid battery pack<br>P0AA6 — HV system insulation fault<br>P0A0A — HV interlock (HVIL) circuit<br>P0A94 — DC-DC converter performance<br>P0AA1 — battery positive contactor stuck closed</td></tr>
<tr><td><b>B</b></td><td>Body</td><td>Airbags, locks, climate</td></tr>
<tr><td><b>C</b></td><td>Chassis</td><td>ABS, steering, brake system</td></tr>
<tr><td><b>U</b></td><td>Network</td><td>U0100 — lost communication with a control unit</td></tr>
</tbody></table></div>
<p>Codes beginning <b>P0</b> are standard across makers; many hybrid and EV faults sit in the <b>P0A–P0E</b> range. Codes beginning <b>P1</b>, and many others, are specific to the maker; you need that maker's information to interpret them.</p>

<h3>18.3 Six common cases</h3>
<h4>Case 1 — "The car is completely dead / will not go to READY"</h4>
<ol><li>Measure the 12 V battery. Below about 12.0 V → charge or replace, then retest.</li><li>Check main 12 V fuses and battery terminals.</li><li>Brake pedal switch (the car needs to see the pedal pressed), key detection, gear in P.</li><li>Scan for codes: HVIL, pre-charge failure, contactor, insulation fault, BMS.</li><li>Has anyone worked on the car recently? A connector not fully seated opens the HVIL.</li></ol>

<h4>Case 2 — "Insulation fault" / "leakage" warning</h4>
<ol><li>Ask <b>when</b> it appears: in rain? after washing? when the A/C or heater is switched on? only when charging?</li><li>Read the live insulation resistance value. Watch it while switching HV consumers on and off (A/C, heater).</li><li>With the system safely isolated, disconnect HV components <b>one at a time</b> and insulation-test each: A/C compressor, PTC heater, on-board charger, motor, cables.</li><li>The reading that is low identifies the faulty part or cable.</li><li>If everything outside the pack tests good, the fault is inside the battery — a specialist job.</li></ol>
<p>Frequent causes: wrong oil in the A/C compressor, water in a connector or the charge port, coolant leaking into a component, rodent-damaged cables.</p>

<h4>Case 3 — "Range has dropped"</h4>
<ol><li>Ask about recent changes: season, route, speed, new tyres, roof rack.</li><li>Tyre pressures, brake drag (spin each wheel; feel for hot wheels after a drive), alignment.</li><li>Scan: SOH, cell voltage spread, battery temperatures.</li><li>If SOH is good and the cells are balanced, the battery is healthy. Explain consumption and conditions.</li></ol>

<h4>Case 4 — "It will not charge"</h4>
<p>Follow the table in Module 14.6. The quickest test is <b>substitution</b>: try a different charger and cable. If the car charges elsewhere, the fault is in the customer's equipment or house supply, not the car.</p>

<h4>Case 5 — "Low power / tortoise light, mostly in summer"</h4>
<ol><li>Scan for temperature-related codes and look at live temperatures for battery, motor and inverter.</li><li>Coolant levels in each reservoir. Pumps running? Radiator and condenser clean? Fans working?</li><li>A/C performance (because the battery depends on it).</li><li>Hybrids: battery fan and ducts.</li></ol>

<h4>Case 6 — Fault appears straight after another repair</h4>
<p>Go back to what was touched. An unplugged or half-latched connector, a pinched wire, an earth strap left off, air left in a coolant loop, or a part that needed coding. The most recent work is the most likely cause.</p>

<h3>18.4 Know your limits</h3>
<aside class="c danger"><h4>Stop and refer the job when…</h4><ul>
<li>the fault is <b>inside the battery pack</b> and you are not trained and equipped for pack work;</li>
<li>the car has <b>crash or flood damage</b> to HV components;</li>
<li>you see signs of <b>overheating, swelling, leaking or smell</b> from the battery;</li>
<li>you do not have the <b>service information</b> for that model;</li>
<li>the repair needs a tool or software you do not have.</li></ul>
<p>Saying "this is beyond what I can do safely; here is who can help" is professional. Guessing with 400 volts is not.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Listen, confirm, basics, scan, research, test, repair, verify.</li>
<li>Codes are clues. Prove the cause by measurement.</li>
<li>P = powertrain, B = body, C = chassis, U = network.</li>
<li>Always start with the 12 V battery and a visual check.</li>
<li>For insulation faults, isolate and test one component at a time.</li>
<li>Know when to stop.</li></ul></aside>

<div class="quiz"><h3>Quiz 18</h3><p>Choose one answer for each question.</p><ol>
<li>What is the first step of the diagnostic method?<ul><li>Replace the most likely part</li><li>Clear all codes</li><li data-c>Listen to the customer</li><li>Remove the battery</li></ul></li>
<li>What does a DTC starting with "U" indicate?<ul><li>Engine fault</li><li>Brake fault</li><li data-c>Network communication fault</li><li>Airbag fault</li></ul></li>
<li>A code says "battery over-temperature". What should you do?<ul><li>Replace the battery</li><li data-c>Check cooling fan, pump, coolant, A/C and sensors to find the real cause</li><li>Ignore it</li><li>Disconnect the temperature sensor</li></ul></li>
<li>An insulation fault appears only when the A/C is switched on. Which component is the first suspect?<ul><li>Motor</li><li>On-board charger</li><li data-c>A/C compressor</li><li>12 V battery</li></ul></li>
<li>A car will not charge at home but charges normally at a public charger. Where is the fault most likely?<ul><li>In the car's battery</li><li data-c>In the home charger, cable or house supply</li><li>In the motor</li><li>In the tyres</li></ul></li>
<li>A warning light comes on the day after another workshop replaced a coolant pump. What do you check first?<ul><li>The oldest parts of the car</li><li data-c>Everything that was touched during that repair</li><li>The paintwork</li><li>The spare wheel</li></ul></li>
<li>When should you refer a job to a specialist?<ul><li>Never</li><li>Only if the customer insists</li><li data-c>When the fault is inside the pack, or you lack the training, information or tools to do it safely</li><li>When it is nearly closing time</li></ul></li>
</ol></div>
</section></template>
<template data-m="19" data-part="Part G · In the workshop" data-title="Maintenance and inspection"><section class="mod">
<div class="mh"><div class="n">19</div><div><div class="pt">Part G · In the workshop</div><h2>Maintenance and inspection</h2><p>EVs need less servicing than petrol cars — but not none. What to check, and when.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>A typical EV and hybrid service schedule</li>
<li>How to carry out a battery health check</li>
<li>How to inspect a used EV before purchase</li></ul></div>

<h3>19.1 A typical service schedule</h3>
<p>Always follow the maker's schedule for the model. This table shows what is typical.</p>
<div class="tw"><table>
<caption>Table 19.1 — Typical maintenance for a battery electric car</caption>
<thead><tr><th>Interval</th><th>Work</th></tr></thead>
<tbody>
<tr><td><b>Every service</b><br>(12 months or 15,000–20,000 km)</td><td>
Scan all modules for fault codes · Battery health report (SOH, cell spread) · 12 V battery test · Tyres: pressure, wear, rotate · Brakes: inspect, clean and lubricate sliders · Suspension and steering joints · Under-body and battery case inspection · Coolant levels (all reservoirs) · Check HV cables and connectors visually for damage (do not disconnect) · Charge port: clean, check pins and seal · Cabin filter · Clean radiator and condenser · Wipers, lights, washer fluid · Software update check</td></tr>
<tr><td><b>Every 2 years</b></td><td>Brake fluid change · A/C performance check · Door and charge-flap seals and drains</td></tr>
<tr><td><b>Every 4–5 years</b> (or as specified)</td><td>Coolant change with correct fluid and bleed procedure · Reduction gear oil (if specified) · 12 V battery likely due for replacement · A/C desiccant where specified</td></tr>
</tbody></table></div>
<p><b>Hybrids and plug-in hybrids:</b> add everything a petrol engine needs — engine oil and filter (by time as well as distance), air filter, spark plugs, engine coolant, fuel system, exhaust — plus the hybrid battery fan and filter, and the transmission (DHT / e-CVT) fluid.</p>

<h3>19.2 The battery health check</h3>
<p>This is a service customers value and will pay for. With a capable scan tool:</p>
<ol>
<li>Record <b>SOH</b> and odometer.</li>
<li>Record <b>highest and lowest cell voltage</b> at rest, and the difference.</li>
<li>Record <b>highest and lowest battery temperature</b>.</li>
<li>Record the <b>insulation resistance</b>.</li>
<li>Note any stored battery or charging fault codes.</li>
<li>If possible, repeat the cell voltage reading during a short acceleration: a weak cell drops much more than the others.</li>
<li>Give the customer a simple written report, and keep a copy. Next year you can show the trend.</li>
</ol>

<h3>19.3 Inspecting a used EV or hybrid</h3>
<p>The used market for EVs is beginning. Buyers are nervous about batteries and will want an independent check.</p>
<div class="tw"><table>
<caption>Table 19.2 — Pre-purchase inspection checklist</caption>
<thead><tr><th>Area</th><th>Check</th></tr></thead>
<tbody>
<tr><td>Documents</td><td>Official import or local assembly? Warranty remaining and transferable? Service history.</td></tr>
<tr><td>Charging</td><td>Inlet type (Type 2 / CCS2 or GB/T). Test AC charging; DC if possible. Condition of pins. Cables supplied.</td></tr>
<tr><td>Battery</td><td>Full health check as above. Compare displayed range at 100% with the original figure.</td></tr>
<tr><td>Under-body</td><td>Battery case dents, scrapes, corrosion, water marks, non-original sealant (sign of opening).</td></tr>
<tr><td>Accident and flood signs</td><td>Paint differences, panel gaps, silt or rust under carpets and in connectors, musty smell.</td></tr>
<tr><td>Cooling and A/C</td><td>Coolant levels and colour; A/C cold at idle; fans working.</td></tr>
<tr><td>Fault codes</td><td>Full scan. Be suspicious if all codes were cleared just before sale (readiness data will show).</td></tr>
<tr><td>Road test</td><td>Smooth drive, no whine or clunk, regeneration working, straight braking, no warning lights.</td></tr>
<tr><td>12 V and accessories</td><td>12 V battery health; quality of any added wiring.</td></tr>
</tbody></table></div>

<h3>19.4 Storage and customer advice</h3>
<ul>
<li>Leaving a car for weeks: store at 40–60% charge, in shade. Do not leave it plugged into a poor-quality supply.</li>
<li>The 12 V battery can go flat during long storage. Advise a periodic wake-up drive or a 12 V maintainer if the maker allows.</li>
<li>Keep records of every job: date, kilometres, readings, parts. Good records build customer trust and protect you if there is a dispute.</li>
</ul>

<aside class="c sum"><h4>Summary</h4><ul>
<li>EV service is inspection-heavy: scan, battery report, 12 V, tyres, brakes, coolant, under-body.</li>
<li>Brake fluid every 2 years; coolant and gear oil as specified.</li>
<li>Hybrids need all petrol-engine servicing as well.</li>
<li>A written battery health report is valuable to owners and buyers.</li></ul></aside>

<div class="quiz"><h3>Quiz 19</h3><p>Choose one answer for each question.</p><ol>
<li>How often should brake fluid typically be changed on an EV?<ul><li>Never</li><li data-c>About every 2 years</li><li>Every 3 months</li><li>Only when the pads are changed</li></ul></li>
<li>Which of these belongs in a battery health report?<ul><li>Tyre brand</li><li data-c>SOH and the difference between highest and lowest cell voltage</li><li>Radio stations</li><li>Paint colour</li></ul></li>
<li>What extra servicing does a plug-in hybrid need compared with a BEV?<ul><li>None</li><li>Only tyres</li><li data-c>All the petrol-engine items such as oil, filters and spark plugs</li><li>A second charge port</li></ul></li>
<li>On a used EV, non-original sealant around the battery case suggests…<ul><li>a factory upgrade</li><li data-c>the pack may have been opened or repaired</li><li>the car is new</li><li>nothing important</li></ul></li>
<li>What is the best state of charge for storing an EV for several weeks?<ul><li>0%</li><li data-c>40–60%</li><li>100%</li><li>It makes no difference</li></ul></li>
</ol></div>
</section></template>
<template data-m="20" data-part="Part G · In the workshop" data-title="Electric bikes and rickshaws"><section class="mod">
<div class="mh"><div class="n">20</div><div><div class="pt">Part G · In the workshop</div><h2>Electric bikes and rickshaws</h2><p>The biggest EV market in Pakistan by numbers, and the easiest place to start earning.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>The parts of an electric two- or three-wheeler</li>
<li>The battery options and how to compare them</li>
<li>How to diagnose the most common faults</li>
<li>The safety points specific to small EVs</li></ul></div>

<h3>20.1 Why this market matters</h3>
<p>More than 200,000 electric bikes and rickshaws were produced in Pakistan in 2025–26, over three times the year before. Government subsidies under the PAVE scheme support models with lithium batteries. These vehicles are simple, the tools are cheap, and the customers are everywhere. For a new technician, this is the fastest route to real experience and income, and every principle is the same as in a car — just smaller.</p>

<h3>20.2 The system</h3>
<figure>
<svg viewBox="0 0 720 280" role="img" aria-label="Block diagram of an electric motorcycle: battery, controller, hub motor, throttle, brake switches, DC-DC converter and charger">
<rect x="270" y="100" width="160" height="80" rx="10" class="yb"/><text x="350" y="132" class="m l bd">Controller</text><text x="350" y="152" class="m s">6 or more MOSFET switches</text><text x="350" y="166" class="m s">= a small inverter</text>
<rect x="40" y="100" width="150" height="80" rx="10" class="hb"/><text x="115" y="132" class="m l bd">Battery</text><text x="115" y="152" class="m s">48 / 60 / 72 V</text><text x="115" y="166" class="m s">with fuse or breaker</text>
<circle cx="600" cy="140" r="62" class="gb"/><circle cx="600" cy="140" r="16" class="db"/><text x="600" y="110" class="m bd">Hub motor</text><text x="600" y="180" class="m s">BLDC, in wheel</text>
<path d="M190 140 H266" class="hv" marker-end="url(#ao)"/>
<path d="M430 126 H534 M430 140 H538 M430 154 H534" stroke="#E8590C" stroke-width="3"/><text x="484" y="116" class="m s bd o">3 phase wires</text>
<path d="M590 201 V212 H450 V168 H434" class="lv da" marker-end="url(#ab)"/><text x="518" y="207" class="m s bl">5 Hall-sensor wires</text>
<rect x="250" y="20" width="90" height="40" rx="6" class="lb"/><text x="295" y="45" class="m s bd">Throttle</text>
<rect x="360" y="20" width="110" height="40" rx="6" class="lb"/><text x="415" y="45" class="m s bd">Brake switches</text>
<rect x="490" y="20" width="90" height="40" rx="6" class="lb"/><text x="535" y="45" class="m s bd">Display</text>
<path d="M295 60 V96" class="lv" marker-end="url(#ab)"/><path d="M400 60 V96" class="lv" marker-end="url(#ab)"/><path d="M535 60 V80 H420 V96" class="lv"/>
<rect x="40" y="216" width="150" height="44" rx="8" class="kb"/><text x="115" y="236" class="m s bd">Charger</text><text x="115" y="251" class="m s">230 V AC → battery DC</text>
<path d="M115 216 V184" class="hv" style="stroke-width:2.5" marker-end="url(#ao)"/>
<rect x="270" y="216" width="160" height="44" rx="8" class="kb"/><text x="350" y="236" class="m s bd">DC-DC converter</text><text x="350" y="251" class="m s">72 V → 12 V</text>
<path d="M150 180 V204 H300 V216" class="hv" style="stroke-width:2.5"/>

</svg>
<figcaption><b>Figure 20.1</b> An electric motorcycle or scooter. A rickshaw is the same with a larger battery and a motor driving a rear axle with differential.</figcaption></figure>
<div class="tw"><table>
<thead><tr><th>Part</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><b>Battery</b></td><td>48, 60 or 72 V. Capacity 20–50 Ah on bikes; more on rickshaws (5–9 kWh).</td></tr>
<tr><td><b>Controller</b></td><td>A small inverter. Rated by voltage and maximum current (for example 72 V, 50 A). Has a low-voltage cut-off to protect the battery.</td></tr>
<tr><td><b>Hub motor</b></td><td>BLDC, 1–3 kW, built into the wheel. Three thick phase wires and five thin Hall-sensor wires (5 V, earth, three signals).</td></tr>
<tr><td><b>Throttle</b></td><td>A Hall sensor giving roughly 0.8 V (closed) to 4.2 V (full) on a 5 V supply.</td></tr>
<tr><td><b>Brake switches</b></td><td>Tell the controller to cut power when a brake lever is pulled.</td></tr>
<tr><td><b>DC-DC converter</b></td><td>Steps battery voltage down to 12 V for lights and horn.</td></tr>
<tr><td><b>Charger</b></td><td>External. <b>Must match the battery's voltage and chemistry.</b></td></tr>
<tr><td><b>BMS</b></td><td>Inside every lithium pack. Lead-acid packs have none.</td></tr>
</tbody></table></div>
<aside class="c danger"><h4>Danger — "small" does not mean safe</h4><ul>
<li>A "72 V" pack reaches <b>84–88 V</b> when fully charged or charging. That is above the 60 V high-voltage limit. A "60 V" pack reaches about 70 V.</li>
<li>These batteries can deliver <b>hundreds of amps</b> into a short circuit. A spanner across the terminals becomes red-hot instantly. Burns and fires are far more common on bikes than shocks.</li>
<li>Remove rings and watches. Disconnect the battery (or switch off its breaker) before working. Insulate the terminals.</li></ul></aside>

<h3>20.3 Battery choices</h3>
<div class="tw"><table>
<caption>Table 20.1 — E-bike battery types</caption>
<thead><tr><th></th><th>Lead-acid ("graphene")</th><th>Lithium (LFP or NMC)</th></tr></thead>
<tbody>
<tr><td>Build</td><td>Five or six 12 V blocks in series (60 V or 72 V)</td><td>One sealed pack with built-in BMS</td></tr>
<tr><td>Weight for the same energy</td><td>About 3 times heavier</td><td>Light</td></tr>
<tr><td>Life</td><td>300–500 cycles (1–2 years of daily use)</td><td>1,000–3,000 cycles</td></tr>
<tr><td>Purchase cost</td><td>Low</td><td>Higher (lower cost per km over its life)</td></tr>
<tr><td>Charging time</td><td>6–8 hours</td><td>2–5 hours</td></tr>
<tr><td>Main risks</td><td>Acid, heavy, short life if deeply discharged</td><td>Fire if poor quality, damaged or wrongly charged</td></tr>
</tbody></table></div>
<p>"<b>Graphene battery</b>" in this market means a lead-acid battery with a carbon additive in the plates. It is a little better than plain lead-acid, but it is still lead-acid.</p>
<aside class="c ex"><h4>Worked example — range</h4>
<p>Battery 72 V, 32 Ah → 72 × 32 = 2,304 Wh. Consumption about 35 Wh/km.</p>
<p>Range = 2,304 ÷ 35 ≈ <b>66 km</b> when new (lead-acid gives less in practice because it should not be fully discharged).</p></aside>

<h3>20.4 Common faults</h3>
<div class="tw"><table>
<thead><tr><th>Complaint</th><th>Checks</th></tr></thead>
<tbody>
<tr><td><b>No drive, display on</b></td><td>Brake switch stuck on (unplug to test) · Side-stand switch · Throttle signal voltage (0.8 → 4.2 V) · Hall-sensor signals (each should switch between about 0 V and 5 V as the wheel is turned slowly by hand) · Controller</td></tr>
<tr><td><b>Completely dead</b></td><td>Battery voltage · Main fuse / breaker · Key switch · Battery connector burnt · Lithium BMS has cut off (very low cell)</td></tr>
<tr><td><b>Wheel hard to turn by hand</b></td><td>Shorted controller MOSFET or phase wires touching. Unplug the three phase wires: if the wheel now turns freely, the controller is at fault; if not, the motor.</td></tr>
<tr><td><b>Short range</b></td><td>Lead-acid: measure each 12 V block after charging <em>and under load</em>. One weak block (drops far below the others) ruins the whole string. Lithium: capacity fade or cell imbalance. Also tyre pressure and dragging brakes.</td></tr>
<tr><td><b>Jerky or noisy motor</b></td><td>One Hall sensor failed · Phase connector loose or burnt · Water in the motor</td></tr>
<tr><td><b>No lights or horn but it drives</b></td><td>DC-DC converter or its fuse</td></tr>
<tr><td><b>Will not charge</b></td><td>Charger output voltage · Charge port and fuse · Lithium BMS charge protection</td></tr>
</tbody></table></div>
<aside class="c pk"><h4>In Pakistan</h4><p><b>Water</b> is the great enemy of cheap e-bikes. Riding through monsoon water floods hub motors, controllers and connectors. Opening, drying, cleaning and re-sealing a hub motor, and replacing rusted bearings and Hall sensors, is steady work every rainy season.</p></aside>

<h3>20.5 Lead-acid to lithium conversions</h3>
<p>Many owners will ask you to replace worn lead-acid blocks with a lithium pack. It can be a good upgrade if done properly:</p>
<ul>
<li>Choose a pack with a real BMS, from a supplier who states the chemistry, cell count and maximum current.</li>
<li>The BMS continuous current rating must exceed the controller's maximum current.</li>
<li><b>Replace the charger.</b> A lead-acid charger must never be used on a lithium pack. Use the charger designed for that pack's chemistry and cell count.</li>
<li>Check the controller's low-voltage cut-off suits the new pack.</li>
<li>Mount the pack firmly, protected from water and impact, with a fuse close to the battery.</li>
</ul>
<aside class="c danger"><h4>Danger — charging fires</h4><p>Most e-bike battery fires happen <b>while charging</b>, usually indoors at night, with a cheap pack, a wrong charger, or a damaged battery. Advise every customer: use only the correct charger; charge in an open, ventilated place away from the exit and from anything that burns; do not charge a swollen, dropped or water-damaged battery; do not leave it charging all night unattended.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Battery → controller → BLDC hub motor, with throttle and brake switches as inputs.</li>
<li>"72 V" really means up to 88 V and very high short-circuit current.</li>
<li>Lead-acid ("graphene") is cheap and short-lived; lithium is lighter and lasts longer but must be good quality.</li>
<li>Test lead-acid blocks individually under load.</li>
<li>Match the charger to the battery. Most fires happen during charging.</li></ul></aside>

<div class="quiz"><h3>Quiz 20</h3><p>Choose one answer for each question.</p><ol>
<li>What type of motor is used in most electric scooter wheels?<ul><li>Induction</li><li data-c>BLDC hub motor</li><li>Petrol</li><li>Stepper</li></ul></li>

<h4>Practise now, safely, on low voltage</h4>
<ul>
<li>Buy a decent multimeter and practise on 12 V: battery voltage, charging voltage, fuse checks, voltage drop across a switch, continuity of a wire.</li>
<li>Build simple circuits with a 12 V battery, bulbs, switches and a relay.</li>
<li>Read any wiring diagram you can find.</li>
<li>Watch a scan tool being used on any car, and learn to navigate its menus.</li>
<li>Take a basic first-aid and CPR class.</li>
</ul>

<h3>21.5 Habits of a professional</h3>
<ol>
<li><b>Safety first, every time.</b> No shortcut is worth your life. Stop anyone who is working unsafely, including your seniors.</li>
<li><b>Measure, don't guess.</b> Diagnose before you replace.</li>
<li><b>Be honest.</b> Tell the customer what you found, what you are sure of, and what you are not. Never invent a fault. Reputation is your real capital.</li>
<li><b>Keep records.</b> Readings, photos, parts fitted.</li>
<li><b>Keep it clean.</b> A tidy bay, clean tools, covered seats. HV connectors must be spotless and dry.</li>
<li><b>Keep learning.</b> This technology changes every year. Read service information, follow training, ask questions.</li>
<li><b>Know your limits</b> — and say so.</li>
</ol>

<aside class="c"><h4>A final word</h4><p>You are entering this trade at the right moment. In ten years, electric and hybrid vehicles will be ordinary in Pakistan, and the people who learned early — properly and safely — will be the ones training others and running the workshops. Study this book until you own it. Then go and get your hands dirty, with your gloves on.</p></aside>
