<template data-m="1" data-part="Part A · Foundations" data-title="The opportunity: EVs and hybrids in Pakistan"><section class="mod">
<div class="mh"><div class="n">1</div><div><div class="pt">Part A · Foundations</div><h2>The opportunity: EVs and hybrids in Pakistan</h2><p>Why these cars are arriving now, which ones you will see, and what work they will bring.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>Why electric and hybrid cars are growing quickly in Pakistan</li>
<li>Which brands and models are on our roads</li>
<li>How an electric car is different to work on than a petrol car</li>
<li>Why independent workshops will be needed</li></ul></div>

<h3>1.1 What is changing</h3>
<p>For many years the Pakistani car market was a small number of Japanese petrol models. That has changed. Since 2024, Chinese manufacturers have entered with battery electric cars and plug-in hybrids, and most of them now assemble cars locally or plan to.</p>
<p>Three things are pushing this change:</p>
<ul>
<li><b>Fuel cost.</b> Petrol is imported and expensive. Electricity per kilometre is much cheaper, especially for owners with solar panels at home.</li>
<li><b>Government policy.</b> The <b>New Energy Vehicle (NEV) Policy 2025–30</b> sets a target that 30% of new vehicles sold in 2030 should be electric, across bikes, rickshaws, cars, buses and trucks. It lowers duties on EV parts and supports local assembly.</li>
<li><b>Chinese technology and price.</b> China makes most of the world's EV batteries. Chinese brands can offer a well-equipped EV or plug-in hybrid at a price close to a Japanese petrol SUV.</li>
</ul>

<aside class="c pk"><h4>In Pakistan — the numbers (2026)</h4><ul>
<li>Target: <b>30%</b> of new vehicle sales electric by 2030.</li>
<li>Target: <b>3,000</b> public charging stations by 2030. In early 2026 there were only around 30–50.</li>
<li>Local production of electric bikes and rickshaws rose from about <b>60,000</b> (2024–25) to about <b>210,000</b> (2025–26).</li>
<li>The PAVE scheme gives buyers a cash subsidy on electric bikes and rickshaws that use lithium batteries.</li>
<li>Regulator NEPRA set a special low electricity tariff for charging stations (base rate Rs 23.57 per unit, plus the station's margin).</li>
</ul></aside>

<h3>1.2 The vehicles you will meet</h3>
<p>You will learn what the letters BEV, PHEV, HEV and REEV mean in Module 4. For now: a <b>BEV</b> has only a battery and motor. A <b>hybrid</b> has an engine and a motor.</p>
<div class="tw"><table>
<caption>Table 1.1 — Main electrified brands in Pakistan (November 2026)</caption>
<thead><tr><th>Brand (local partner)</th><th>Battery electric (BEV)</th><th>Plug-in / range-extender</th><th>Hybrid (HEV)</th></tr></thead>
<tbody>
<tr><td><b>BYD</b> (Mega Motor / HUBCO)</td><td>Atto 2, Atto 3, Seal, Sealion 7</td><td>Sealion 6, Shark 6 pickup</td><td>—</td></tr>
<tr><td><b>Changan Deepal</b> (Master Changan)</td><td>S07, L07, E07</td><td>S05 (range extender)</td><td>—</td></tr>
<tr><td><b>MG</b> (MG JW)</td><td>ZS EV, MG4, MG5 EV, Binguo</td><td>HS PHEV</td><td>—</td></tr>
<tr><td><b>GWM Haval</b> (Sazgar)</td><td>Ora 03</td><td>H6 PHEV</td><td>H6 HEV, Jolion HEV</td></tr>
<tr><td><b>Chery / Jaecoo</b></td><td>Chery Q</td><td>Tiggo 7, 8, 9 PHEV; Jaecoo J7 PHEV</td><td>—</td></tr>
<tr><td><b>Toyota</b> (Indus Motor)</td><td>—</td><td>—</td><td>Corolla Cross HEV; used imports: Aqua, Prius, Yaris</td></tr>
<tr><td><b>Honda</b> (Honda Atlas)</td><td>—</td><td>—</td><td>HR-V e:HEV; used imports: Vezel, Fit</td></tr>
<tr><td><b>Hyundai / Kia</b></td><td>Ioniq 5, EV5 (small numbers)</td><td>—</td><td>Tucson, Santa Fe, Sportage HEV</td></tr>
</tbody></table></div>
<p>There are also many small Chinese city EVs (for example Honri VE and other mini cars), and a very large number of electric motorcycles, scooters and rickshaws. Module 20 covers the two- and three-wheelers.</p>

<aside class="c tip"><h4>Workshop tip</h4><p>Do not forget the <b>used Japanese hybrids</b>. Tens of thousands of imported Toyota Aqua, Prius and Honda Vezel hybrids are already 8–15 years old. Their hybrid batteries are wearing out now. This is work that exists today, not in five years.</p></aside>

<h3>1.3 Why independent workshops matter</h3>
<p>A new EV usually has a vehicle warranty of about 4–6 years and a battery warranty of around 8 years or 160,000 km. During warranty, owners go to the dealer.</p>
<p>After warranty, things change. Dealer labour rates and parts prices are high. A middle-class family with limited spare income will look for a trusted private workshop — the same way they do today for a Corolla or a Mehran. The problem is that very few private workshops understand high-voltage cars. Many mechanics are afraid of them, and they are right to be afraid if they are not trained.</p>
<aside class="c"><h4>Key idea</h4><p>The cars are arriving faster than the technicians. A person who can <b>safely</b> diagnose and repair EVs and hybrids will have a skill that is in short supply for many years.</p></aside>

<h3>1.4 How is an EV different to work on?</h3>
<div class="tw"><table>
<caption>Table 1.2 — Petrol car and electric car compared</caption>
<thead><tr><th>Area</th><th>Petrol car</th><th>Battery electric car</th></tr></thead>
<tbody>
<tr><td>Moving parts in the drive unit</td><td>Hundreds (pistons, valves, gearbox)</td><td>Around 20 (rotor, a few gears, bearings)</td></tr>
<tr><td>Regular service items</td><td>Engine oil, oil filter, air filter, spark plugs, belts</td><td>Cabin filter, brake fluid, coolant, tyres</td></tr>
<tr><td>Main danger</td><td>Fuel fire, hot parts, moving belts</td><td><b>High voltage</b> (200–800 V), battery fire</td></tr>
<tr><td>Main tool</td><td>Spanners and experience</td><td>Scan tool, multimeter, insulation tester</td></tr>
<tr><td>Typical faults</td><td>Mechanical wear</td><td>Electrical, sensors, software, cooling, 12 V battery</td></tr>
<tr><td>Brake wear</td><td>Normal</td><td>Low (the motor does most of the braking)</td></tr>
<tr><td>Tyre wear</td><td>Normal</td><td>Higher (heavy car, strong torque)</td></tr>
</tbody></table></div>
<p>An EV still has suspension, steering, brakes, tyres, air-conditioning, lights and body work. Your normal mechanical skills remain useful. What is new is the <b>high-voltage system</b> and the amount of <b>electronics and software</b>.</p>

<h3>1.5 What an EV technician actually does</h3>
<ul>
<li>Makes the car safe before any work (isolating the high-voltage system)</li>
<li>Reads fault codes and live data with a scan tool, and understands what they mean</li>
<li>Tests batteries, cables, motors and chargers with meters</li>
<li>Replaces parts: 12 V batteries, coolant pumps, chargers, contactors, sensors, drive units</li>
<li>Services cooling systems, brakes, air-conditioning and suspension</li>
<li>Explains problems honestly to the customer</li>
</ul>
<p>At a higher level, after more training: opening battery packs, replacing modules, and repairing power electronics.</p>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Fuel cost, government policy and Chinese technology are driving EVs and hybrids into Pakistan.</li>
<li>You will see Chinese BEVs and PHEVs, Japanese and Korean hybrids, and many electric bikes and rickshaws.</li>
<li>After warranty, owners need affordable private workshops, and trained technicians are scarce.</li>
<li>EVs have fewer mechanical parts but need electrical knowledge, diagnostic tools and strict safety.</li></ul></aside>

<div class="quiz"><h3>Quiz 1</h3><p>Choose one answer for each question.</p><ol>
<li>What is the NEV Policy target for electric vehicles as a share of new sales by 2030?<ul><li>10%</li><li data-c>30%</li><li>60%</li><li>100%</li></ul></li>
<li>Why will many owners move to private workshops after a few years?<ul><li>Dealers do not repair EVs</li><li>EVs never break down</li><li data-c>The warranty ends and dealer repairs are expensive</li><li>Private workshops are required by law</li></ul></li>
<li>Which of these is NOT a regular service item on a battery electric car?<ul><li>Brake fluid</li><li>Cabin filter</li><li>Tyres</li><li data-c>Spark plugs</li></ul></li>
<li>What is the main new danger when working on EVs compared with petrol cars?<ul><li data-c>High voltage</li><li>Hot exhaust</li><li>Engine oil</li><li>Heavy gearbox</li></ul></li>
<li>Which group of vehicles already needs hybrid battery work in Pakistan today?<ul><li>New BYD cars</li><li data-c>Used Japanese hybrids such as Aqua, Prius and Vezel</li><li>Diesel trucks</li><li>Electric buses only</li></ul></li>
</ol></div>
</section></template>
<template data-m="2" data-part="Part A · Foundations" data-title="Electricity basics"><section class="mod">
<div class="mh"><div class="n">2</div><div><div class="pt">Part A · Foundations</div><h2>Electricity basics</h2><p>Volts, amps, ohms, watts and kilowatt-hours — the language of every EV specification.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>What voltage, current and resistance are, and how Ohm's law links them</li>
<li>The difference between power (kW) and energy (kWh)</li>
<li>The difference between AC and DC</li>
<li>What happens when cells are connected in series and in parallel</li></ul></div>

<h3>2.1 Voltage, current and resistance</h3>
<p>Think of electricity as water in pipes.</p>
<ul>
<li><b>Voltage (V)</b> is the <em>pressure</em> pushing the electricity. Unit: <b>volt (V)</b>.</li>
<li><b>Current (I)</b> is the <em>flow</em> — how much electricity passes each second. Unit: <b>ampere or amp (A)</b>.</li>
<li><b>Resistance (R)</b> is anything that <em>restricts</em> the flow, like a narrow pipe. Unit: <b>ohm (Ω)</b>.</li>
</ul>
<p>More pressure gives more flow. More restriction gives less flow. This is <b>Ohm's law</b>:</p>
<p style="text-align:center;font-size:1.2em"><span class="f">V = I × R</span> &nbsp; <span class="f">I = V ÷ R</span> &nbsp; <span class="f">R = V ÷ I</span></p>

<h3>2.2 Power: how fast energy is used</h3>
<p><b>Power (P)</b> is how quickly electrical energy is being used or delivered. Unit: <b>watt (W)</b>. One <b>kilowatt (kW)</b> is 1,000 watts.</p>
<p style="text-align:center;font-size:1.2em"><span class="f">P = V × I</span></p>
<aside class="c ex"><h4>Worked example</h4>
<p>An EV battery at <b>400 V</b> supplies <b>250 A</b> to the motor. What power is that?</p>
<p>P = V × I = 400 × 250 = 100,000 W = <b>100 kW</b></p>
<p>For comparison, one horsepower (hp) is about 0.75 kW. So 100 kW ≈ 134 hp.</p></aside>

<h3>2.3 Energy: how much work can be done</h3>
<p><b>Energy</b> is power used over time. In EVs we measure it in <b>kilowatt-hours (kWh)</b>. It is the same "unit" that appears on your electricity bill.</p>
<p style="text-align:center;font-size:1.2em"><span class="f">Energy (kWh) = Power (kW) × Time (hours)</span></p>
<aside class="c"><h4>Key idea</h4><p><b>kW is like the size of the tap. kWh is like the size of the water tank.</b><br>
Motor power (kW) tells you how strongly the car can accelerate. Battery energy (kWh) tells you how far it can go. Many people confuse them. A technician must not.</p></aside>
<figure class="pic">
<svg viewBox="0 0 720 210" role="img" aria-label="Tap and tank picture: kilowatt-hours are the size of the tank, kilowatts are the size of the pipe">

<aside class="c ex"><h4>Worked example</h4>
<p>A car uses an average of 15 kW while cruising. Its battery holds 60 kWh. How long can it cruise?</p>
<p>Time = Energy ÷ Power = 60 ÷ 15 = <b>4 hours</b></p></aside>

<h4>Amp-hours (Ah)</h4>
<p>Battery cells are often rated in <b>amp-hours (Ah)</b>. A 100 Ah cell can give 100 A for 1 hour, or 10 A for 10 hours. To convert to energy, multiply by the voltage:</p>
<p style="text-align:center;font-size:1.2em"><span class="f">Energy (Wh) = Voltage (V) × Capacity (Ah)</span></p>
<p>Example: a 12 V, 50 Ah car battery stores 12 × 50 = 600 Wh = 0.6 kWh. An EV battery stores about 100 times more.</p>

<h3>2.4 Why EVs use high voltage</h3>
<p>Look again at <span class="f">P = V × I</span>. To deliver 100 kW you can use high voltage and low current, or low voltage and high current.</p>
<div class="tw"><table>
<thead><tr><th>Voltage</th><th>Current needed for 100 kW</th><th>Cable needed</th></tr></thead>
<tbody><tr><td>12 V</td><td>8,333 A</td><td>Impossible — thick as your arm</td></tr>
<tr><td>400 V</td><td>250 A</td><td>About as thick as your thumb</td></tr>
<tr><td>800 V</td><td>125 A</td><td>Thinner and lighter again</td></tr></tbody></table></div>
<p>Current causes heating in cables. The heat loss is <span class="f">P<sub>loss</sub> = I² × R</span>. If you halve the current, the heat loss falls to a quarter. That is why EVs use 400 V or 800 V: thinner cables, less wasted heat, faster charging. The price is <b>danger</b> — see Module 3.</p>

<h3>2.5 DC and AC</h3>
<ul>
<li><b>Direct current (DC)</b> flows in one direction only. Batteries store and give DC.</li>
<li><b>Alternating current (AC)</b> changes direction many times each second. Mains electricity in Pakistan is AC: <b>230 V, 50 Hz</b> (50 cycles per second). Factories and large chargers use <b>three-phase</b> AC at 400 V.</li>
</ul>
<figure>
<svg viewBox="0 0 720 170" role="img" aria-label="Graphs of DC, single-phase AC and three-phase AC">

<aside class="c"><h4>Key idea</h4><p>The battery is <b>DC</b>. The mains is <b>AC</b>. The drive motor runs on <b>three-phase AC</b>. So every EV needs boxes that convert between them: a <b>charger</b> (AC → DC) and an <b>inverter</b> (DC → AC). You will meet them in Module 10.</p></aside>

<h3>2.6 Series and parallel</h3>
<p>One battery cell gives only about 3 to 4 volts. To build a 400 V pack, cells are joined together. There are two ways.</p>
<figure>
<svg viewBox="0 0 720 210" role="img" aria-label="Cells connected in series add voltage; cells in parallel add capacity">

<aside class="c ex"><h4>Worked example</h4>
<p>A pack has 120 cells in series. Each cell is 3.2 V and 150 Ah.</p>
<p>Pack voltage = 120 × 3.2 = <b>384 V</b><br>Pack energy = 384 V × 150 Ah = 57,600 Wh = <b>57.6 kWh</b></p></aside>

<h3>2.7 Useful units</h3>
<div class="tw"><table>
<thead><tr><th>Quantity</th><th>Symbol</th><th>Unit</th><th>EV example</th></tr></thead>
<tbody><tr><td>Voltage</td><td>V</td><td>volt (V)</td><td>Pack voltage 400 V</td></tr>
<tr><td>Current</td><td>I</td><td>amp (A)</td><td>Fast charging at 200 A</td></tr>
<tr><td>Resistance</td><td>R</td><td>ohm (Ω), kΩ, MΩ</td><td>Insulation resistance 5 MΩ</td></tr>
<tr><td>Power</td><td>P</td><td>watt (W), kW</td><td>Motor power 150 kW</td></tr>
<tr><td>Energy</td><td>E</td><td>Wh, kWh</td><td>Battery 60 kWh</td></tr>
<tr><td>Capacity</td><td>C</td><td>amp-hour (Ah)</td><td>Cell 150 Ah</td></tr>
<tr><td>Frequency</td><td>f</td><td>hertz (Hz)</td><td>Mains 50 Hz</td></tr></tbody></table></div>
<p>Prefixes: <b>m</b> (milli) = ÷1,000 · <b>k</b> (kilo) = ×1,000 · <b>M</b> (mega) = ×1,000,000.</p>

<h3>2.8 Colour codes: what the colours mean</h3>
<p>Colour is the fastest safety information you have. These conventions are used on real vehicles and tools, and the diagrams in this book follow them wherever a convention exists.</p>

<aside class="c pic"><h4>Picture it — a traffic light for your hands</h4><p><b>Orange = stop and think.</b> Treat every orange cable like a red traffic light: you do not pass until you have isolated, waited and proved dead. <b>Red = positive, black = negative</b> on every battery and every meter: "red to plus".</p></aside>
<aside class="c tip"><h4>Workshop tip</h4><p>Inside a 12 V wiring loom, wire colours are <b>different on every make</b>. Never guess a wire's job from its colour; use the wiring diagram, which lists the colour code and pin number of every wire. The three motor phase cables (U, V, W) are all orange, so they are identified by labels, not colours.</p><p><b>In this book's diagrams:</b> orange lines are high voltage, red is 12 V positive or a meter's positive lead, black is negative, thin blue lines are low-voltage signal and control wires, and grey is mechanical drive.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Voltage pushes, current flows, resistance restricts. <span class="f">V = I × R</span>.</li>
<li>Power <span class="f">P = V × I</span> in kW. Energy = power × time in kWh.</li>
<li>kW = how strong. kWh = how far.</li>
<li>High voltage lets EVs carry big power with small current.</li>
<li>Batteries are DC. Mains and motors are AC.</li>
<li>Series adds voltage. Parallel adds capacity.</li>
<li>Orange = high voltage. Red = positive. Black = negative.</li></ul></aside>

<div class="quiz"><h3>Quiz 2</h3><p>Choose one answer for each question.</p><ol>
<li>A heater has a resistance of 23 Ω and is connected to 230 V. What current flows?<ul><li>0.1 A</li><li data-c>10 A</li><li>253 A</li><li>5,290 A</li></ul></li>
<li>A battery supplies 300 A at 350 V. What is the power?<ul><li>650 W</li><li>10.5 kW</li><li data-c>105 kW</li><li>1,050 kW</li></ul></li>

<li>Four 3.7 V, 50 Ah cells are connected in series. What do you get?<ul><li>3.7 V, 200 Ah</li><li data-c>14.8 V, 50 Ah</li><li>14.8 V, 200 Ah</li><li>3.7 V, 50 Ah</li></ul></li>
<li>Why do EVs use 400 V or more instead of 12 V?<ul><li>High voltage is safer</li><li>Batteries cannot be made at 12 V</li><li data-c>The same power needs much less current, so cables are thinner and losses lower</li><li>Motors only work above 300 V</li></ul></li>
<li>What type of electricity does a battery store?<ul><li data-c>DC</li><li>Single-phase AC</li><li>Three-phase AC</li><li>All three</li></ul></li>
</ol></div>

<h3>3.1 How much voltage is dangerous?</h3>
<p>International vehicle standards define <b>high voltage</b> as anything above <b>60 V DC</b> or <b>30 V AC</b>. Below this, dry skin normally protects you. Above this, current can pass through your body.</p>
<figure>

<h3>3.2 What electricity does to the body</h3>
<p>It is the <b>current</b> through your body that injures you. The voltage decides how much current flows. Your body's resistance is roughly 1,000 Ω when skin is damp or broken.</p>
<aside class="c ex"><h4>Worked example</h4><p>You touch 400 V across your body with sweaty hands (R ≈ 1,000 Ω).</p><p>I = V ÷ R = 400 ÷ 1,000 = 0.4 A = <b>400 mA</b>. The table below shows this is many times a deadly current.</p></aside>
<div class="tw"><table>
<caption>Table 3.1 — Effect of current through the body</caption>
<thead><tr><th>Current</th><th>Effect</th></tr></thead>
<tbody><tr><td>1 mA</td><td>Slight tingle</td></tr>
<tr><td>10–20 mA</td><td>Muscles lock. You cannot let go.</td></tr>
<tr><td>50–100 mA</td><td>Heart rhythm is disturbed (fibrillation). Death is likely without fast help.</td></tr>
<tr><td>Over 200 mA</td><td>Severe burns, heart stops, damage to internal organs</td></tr></tbody></table></div>
<p>There are three ways high voltage hurts you:</p>
<ol>
<li><b>Electric shock</b> — current through the body, especially hand to hand across the chest.</li>
<li><b>Arc flash</b> — if a metal tool bridges two battery terminals, thousands of amps flow. The metal explodes into a flash hotter than a welding arc. It burns skin and eyes in a fraction of a second.</li>
<li><b>Fire and chemical</b> — a damaged lithium cell can overheat, vent toxic gas and burn (thermal runaway, Module 8).</li>
</ol>

<aside class="c pk"><h4>In Pakistan</h4><p>Summer heat means sweat. Sweaty skin has low resistance, so the same voltage pushes more current through you. Monsoon rain and flooding add water to the mix. Our conditions make high-voltage discipline <b>more</b> important, not less.</p></aside>

<h3>3.3 How the car protects you</h3>
<p>Manufacturers build several layers of protection into every EV and hybrid.</p>
<div class="tw"><table>
<thead><tr><th>Protection</th><th>What it does</th></tr></thead>
<tbody>
<tr><td><b>Orange cables</b></td><td>All high-voltage cables and connectors are coloured orange. Orange means: do not touch unless the system is proven dead.</td></tr>
<tr><td><b>Isolated system</b></td><td>The high-voltage circuit is not connected to the car body. Both + and − are insulated from the chassis ("floating"). The 12 V system, in contrast, uses the body as its negative.</td></tr>
<tr><td><b>Contactors</b></td><td>Large relays inside the battery pack. When the car is off, they open and disconnect the battery from everything outside the pack.</td></tr>
<tr><td><b>HVIL</b> (high-voltage interlock loop)</td><td>A small low-voltage wire loop running through every HV connector and cover. If a connector is unplugged, the loop breaks and the contactors open.</td></tr>
<tr><td><b>Insulation monitoring</b></td><td>The car constantly measures the resistance between the HV system and the body. If it falls too low, it warns the driver or refuses to start.</td></tr>
<tr><td><b>Service disconnect</b></td><td>A plug or switch that a technician removes to break the HV circuit, often in the middle of the pack.</td></tr>
<tr><td><b>Crash cut-off</b></td><td>When airbags fire, the contactors are opened at once, sometimes by a small explosive fuse (pyro-fuse).</td></tr>
<tr><td><b>Discharge circuit</b></td><td>Capacitors in the inverter store charge. After switch-off, the car drains them, usually within seconds to a few minutes.</td></tr>
</tbody></table></div>
<aside class="c danger"><h4>Danger — where the protection ends</h4><ul>
<li><b>Inside the battery pack is always live.</b> Contactors and the service plug only disconnect the pack from the rest of the car. The cells themselves cannot be switched off.</li>
<li>Protection systems can fail, especially after a <b>crash, flood or fire</b>, or after a bad repair.</li>
<li>Capacitors can hold charge if the discharge circuit has failed.</li>
<li>So we never trust the car. <b>We always measure.</b></li></ul></aside>

<h3>3.4 Personal protective equipment (PPE)</h3>
<div class="tw"><table>
<caption>Table 3.2 — Minimum PPE for high-voltage work</caption>
<thead><tr><th>Item</th><th>Requirement</th><th>Check before every use</th></tr></thead>
<tbody>
<tr><td><b>Insulating gloves</b></td><td>Rubber, <b>Class 0</b> (rated 1,000 V AC / 1,500 V DC), marked with standard IEC 60903 or ASTM D120</td><td>Roll the cuff to trap air and squeeze: any leak means throw them away. Check date stamp. No cuts, cracks or oil.</td></tr>
<tr><td><b>Leather over-gloves</b></td><td>Worn over the rubber gloves to protect them from cuts</td><td>Clean, no metal parts</td></tr>
<tr><td><b>Eye and face protection</b></td><td>Safety glasses always; face shield when a live arc is possible</td><td>No cracks</td></tr>
<tr><td><b>Safety shoes</b></td><td>Insulating soles, dry</td><td>Soles not worn through</td></tr>
<tr><td><b>Clothing</b></td><td>Cotton, long sleeves. No synthetic clothes that melt onto skin.</td><td>Dry</td></tr>
<tr><td><b>Insulated tools</b></td><td>Marked 1,000 V (VDE)</td><td>Insulation not damaged</td></tr>
<tr><td><b>Test meter</b></td><td>Rated <b>CAT III 1,000 V</b> with matching leads</td><td>Leads undamaged; prove it on a known voltage</td></tr>
</tbody></table></div>

<p><b>Remove all metal</b> from your body: rings, watch, bracelet, chain, keys in pockets, metal belt buckle near the work.</p>
<aside class="c tip"><h4>Workshop tip</h4><p>Ordinary rubber or mechanic's gloves are <b>not</b> insulating gloves. Real Class 0 gloves have the class and voltage printed on the cuff. They cost more, they are worth more, and they must be re-tested or replaced regularly (typically every 6 months).</p></aside>

<h3>3.5 The workshop area</h3>
<ul>
<li>A clean, dry bay. No water on the floor.</li>
<li>Barrier or cones around the car, and a sign: <b>"DANGER — HIGH VOLTAGE — DO NOT TOUCH"</b>.</li>
<li>A <b>second person</b> nearby who knows what you are doing and how to help.</li>
<li>An insulated <b>rescue hook</b> (a non-conducting pole) to pull a person away from a live part.</li>
<li>Fire extinguisher (CO₂ or dry powder for small electrical fires) and access to plenty of water.</li>
<li>Insulating rubber mat to stand on.</li>
</ul>

<h3>3.6 The safe isolation procedure</h3>
<p>Every manufacturer has its own exact procedure. You <b>must</b> follow the service manual for the car in front of you. But all procedures follow the same logic: <b>switch off → disconnect → secure → wait → prove dead</b>.</p>
<ol class="steps">
<li><b>Prepare the car.</b> Park on a level, dry surface. Select P, apply parking brake, chock the wheels. Unplug any charging cable.</li>
<li><b>Switch off and remove the key.</b> Take the smart key at least 5 metres away so the car cannot wake up. Check the "READY" light is off.</li>
<li><b>Put on PPE and set up the area.</b> Gloves checked, glasses on, signs and barrier in place.</li>
<li><b>Disconnect the 12 V battery negative terminal.</b> Without 12 V, the contactors cannot close.</li>
<li><b>Remove the service disconnect</b> (wearing gloves). Keep it in your pocket or a locked box so nobody can refit it. This is "lock out, tag out".</li>
<li><b>Wait.</b> The manual gives a time, usually 5 to 10 minutes, for capacitors to discharge.</li>
<li><b>Prove dead — the three-step test.</b> (a) Test your meter on a known live source, such as the 12 V battery. (b) Measure at the HV point you will work on: + to −, + to body, − to body. All must read near 0 V. (c) Test your meter on the known source again to prove it still works.</li>
<li><b>Only now begin work.</b> If you leave the car and return, prove dead again.</li>
</ol>
<aside class="c"><h4>Key idea — "prove, test, prove"</h4><p>A meter with a broken lead or a flat battery reads 0 V on a live circuit. That is why you check the meter <b>before and after</b> the dead test. Many electricians have died trusting a faulty meter.</p></aside>

<h3>3.7 Special danger situations</h3>
<ul>
<li><b>Accident-damaged cars.</b> Insulation may be cut and the body may be live. Treat every orange cable and the pack case as live. Look for leaking fluid, smoke, a sweet chemical smell, or hissing sounds.</li>
<li><b>Flood-damaged cars.</b> Water inside a pack causes corrosion and short circuits that can start a fire days or weeks later. Store such cars outdoors, away from buildings and other cars.</li>
<li><b>Charging.</b> Never work on a car while it is plugged in.</li>
<li><b>Towing.</b> Many EVs must be moved on a flatbed truck. Turning the driven wheels spins the motor, which generates voltage.</li>
<li><b>Hybrids.</b> The engine can start by itself when the car is in READY mode. Always switch fully off.</li>
</ul>

<h3>3.8 Emergencies</h3>
<h4>If someone is receiving a shock</h4>
<ol>
<li><b>Do not touch them.</b> You will become the second victim.</li>
<li>Switch off the source if you can do it instantly.</li>
<li>Pull them clear with the insulated rescue hook, or dry wood or thick dry cloth — never metal, never wet.</li>
<li>Call for help: <b>Rescue 1122</b>.</li>
<li>If they are not breathing, start CPR and continue until help arrives. Every EV workshop should have at least one person trained in first aid.</li>
<li>Anyone who has had an electric shock must see a doctor, even if they feel fine. Heart problems can appear hours later.</li>
</ol>
<h4>If a battery is smoking or burning</h4>
<ol>
<li>Get everyone out and away. The smoke is toxic.</li>
<li>Call the fire service (Rescue 1122 / 16) and say clearly: <b>"electric vehicle battery fire"</b>.</li>
<li>If safe, move other cars away. Do not try to be a hero.</li>
<li>A lithium battery fire needs a very large amount of water for a long time to cool it. It can re-ignite hours later.</li>
</ol>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Above 60 V DC is high voltage. EVs use 200–800 V DC. This kills.</li>
<li>Orange = high voltage. Never touch unless proven dead.</li>
<li>The car has many protections, but the inside of the battery is always live and protections can fail.</li>
<li>Class 0 gloves, eye protection, insulated tools, CAT III 1,000 V meter, no metal jewellery.</li>
<li>Switch off → disconnect 12 V → remove service plug → wait → prove dead (prove, test, prove).</li>
<li>Never work alone. Never touch a shock victim with bare hands.</li></ul></aside>

<div class="quiz"><h3>Quiz 3 — target 100%</h3><p>Choose one answer for each question.</p><ol>
<li>Above what DC voltage is a vehicle system classed as high voltage?<ul><li>12 V</li><li>30 V</li><li data-c>60 V</li><li>230 V</li></ul></li>
<li>What colour are high-voltage cables?<ul><li>Red</li><li>Yellow</li><li>Blue</li><li data-c>Orange</li></ul></li>
<li>After removing the service disconnect, which part is still live?<ul><li>The inverter</li><li>The motor</li><li data-c>The inside of the battery pack</li><li>Nothing is live</li></ul></li>
<li>Which gloves are correct for high-voltage work?<ul><li>Thick leather welding gloves</li><li>Nitrile mechanic's gloves</li><li data-c>Class 0 rubber insulating gloves with leather over-gloves</li><li>Any dry gloves</li></ul></li>
<li>What is the correct order?<ul><li>Remove service plug, then switch off</li><li data-c>Switch off, disconnect 12 V, remove service plug, wait, prove dead</li><li>Prove dead, then switch off</li><li>Disconnect orange cables, then wait</li></ul></li>
<li>Why do you test the meter on a known live source before AND after measuring?<ul><li>To charge the meter</li><li>To save time</li><li data-c>To be sure a 0 V reading is real and not a faulty meter</li><li>It is not necessary</li></ul></li>
<li>A colleague is stuck to a live part. What do you do first?<ul><li>Grab and pull them away</li><li>Pour water on them</li><li data-c>Do not touch them; cut the power or use an insulated hook</li><li>Run to find the owner</li></ul></li>
<li>What does the HVIL do?<ul><li>Charges the 12 V battery</li><li data-c>Opens the contactors if a high-voltage connector or cover is opened</li><li>Cools the battery</li><li>Measures the battery's state of charge</li></ul></li>
</ol></div>

<div class="learn"><h4>You will learn</h4><ul>
<li>The five main types of electrified vehicle</li>
<li>The difference between series, parallel and series-parallel hybrids</li>
<li>How to recognise each type from its specification</li></ul></div>

<h3>4.1 The electrification ladder</h3>
<p>"Electrified" means the car uses an electric motor for at least part of its driving. The more electric it is, the bigger its battery and the higher its voltage.</p>

<p>You may also hear <b>FCEV</b> (fuel-cell electric vehicle). It makes electricity on board from hydrogen gas. There are none in normal use in Pakistan, so this course does not cover them.</p>
<aside class="c pk"><h4>In Pakistan</h4><p>PHEVs suit our conditions well. Most daily city driving is under 50 km, which a PHEV can do on cheap electricity. For Lahore–Islamabad or Karachi–Hyderabad, where chargers are still rare, the petrol engine removes the worry. This is why Chinese PHEV SUVs have sold strongly. Expect to see a lot of them in your workshop.</p></aside>

<h3>4.2 Three ways to arrange a hybrid</h3>
<p>Every hybrid is one of three basic layouts, or a mixture that can switch between them.</p>

<h3>4.3 Reading a specification sheet</h3>
<p>When a customer or a parts supplier describes a car, these clues tell you its type:</p>
<ul>
<li><b>Battery in kWh.</b> About 1–2 kWh → HEV. 10–30 kWh → PHEV. Over 40 kWh → BEV.</li>
<li><b>A charging port</b> → PHEV, REEV or BEV. HEVs and MHEVs have none.</li>
<li><b>An exhaust pipe</b> → it has an engine, so not a BEV.</li>
<li><b>"EV range" and "combined range"</b> quoted together → PHEV or REEV.</li>
</ul>

<h3>4.4 Buses, coaches and trucks</h3>
<p>Electric commercial vehicles use the same principles as cars, on a larger scale. Chinese training courses often include a day on them, because China runs the world's largest fleets of electric buses.</p>
<div class="tw"><table>
<caption>Table 4.2 — Passenger car and electric bus compared</caption>
<thead><tr><th></th><th>Passenger EV</th><th>Electric bus or coach</th></tr></thead>
<tbody>
<tr><td>System voltage</td><td>300–450 V (some 800 V)</td><td>Typically 500–750 V</td></tr>
<tr><td>Battery energy</td><td>40–100 kWh</td><td>200–450 kWh, in several packs (roof, floor or rear)</td></tr>
<tr><td>Chemistry</td><td>LFP or NMC</td><td>Almost always LFP</td></tr>
<tr><td>Drive</td><td>One or two motors, 100–400 kW</td><td>Large central motor or motors in the axle</td></tr>
<tr><td>Extra high-voltage consumers</td><td>A/C compressor, heater</td><td>Also an electric <b>air compressor</b> (brakes, doors, suspension) and electric <b>power-steering pump</b>, fed from a "multi-in-one" controller</td></tr>
<tr><td>Low-voltage system</td><td>12 V</td><td>24 V</td></tr>
<tr><td>Charging</td><td>AC and DC</td><td>Mostly high-power DC, sometimes two guns at once</td></tr>
</tbody></table></div>
<p>Everything in Module 3 applies with more force: higher voltage, far more stored energy, components mounted on the roof (working at height), and a much heavier vehicle.</p>

<aside class="c sum"><h4>Summary</h4><ul>
<li>MHEV → HEV → PHEV → REEV → BEV: battery and voltage grow at each step.</li>
<li>HEVs do not plug in. PHEVs, REEVs and BEVs do.</li>
<li>Series: engine makes electricity only. Parallel: engine and motor both drive. Series-parallel: both.</li>
<li>Battery size in kWh is the quickest clue to the type of car.</li></ul></aside>

<div class="mh"><div class="n">5</div><div><div class="pt">Part B · The vehicles</div><h2>Main components: a map of the car</h2><p>Every major part of an electric car, what it does, and how energy flows between them.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>The names and jobs of the main high-voltage components</li>
<li>Where they are usually found in the car</li>
<li>How energy flows when charging, driving and braking</li></ul></div>

<h3>5.1 The big picture</h3>
<p>Most modern EVs use a "<b>skateboard</b>" layout. The battery is a flat slab under the floor between the axles. The motor and its electronics sit at one or both axles. This keeps the weight low and leaves the cabin free.</p>

<h3>5.2 What each component does</h3>
<div class="tw"><table>
<caption>Table 5.1 — Main components of an electric car</caption>
<thead><tr><th>Component</th><th>Job</th><th>Module</th></tr></thead>
<tbody>
<tr><td><b>HV battery pack</b></td><td>Stores the energy (DC, 300–800 V). Contains the cells, the BMS, contactors, fuses and sensors.</td><td>6–8</td></tr>
<tr><td><b>BMS</b> (battery management system)</td><td>The battery's brain. Measures every cell, controls contactors, protects the pack.</td><td>8</td></tr>
<tr><td><b>Inverter</b> (motor controller, MCU)</td><td>Changes battery DC into three-phase AC to drive the motor, and back again during braking.</td><td>10</td></tr>
<tr><td><b>Traction motor</b></td><td>Turns electrical power into rotation. Also works as a generator when braking.</td><td>9</td></tr>
<tr><td><b>Reduction gear</b></td><td>A single-speed gearbox with differential. Reduces motor speed and multiplies torque.</td><td>12</td></tr>
<tr><td><b>On-board charger</b> (OBC)</td><td>Changes AC from the mains into DC to charge the battery.</td><td>10, 14</td></tr>
<tr><td><b>DC-DC converter</b></td><td>Steps HV down to about 14 V to run the 12 V system and charge the 12 V battery. It replaces the alternator.</td><td>10, 16</td></tr>
<tr><td><b>PDU</b> (power distribution unit)</td><td>The high-voltage junction box with fuses and relays for each HV consumer.</td><td>10</td></tr>
<tr><td><b>Charge port</b></td><td>Where the charging cable plugs in. AC and DC pins.</td><td>14</td></tr>
<tr><td><b>Electric A/C compressor</b></td><td>Runs on high voltage, so the air-conditioning works with no engine. Also cools the battery on many cars.</td><td>15</td></tr>
<tr><td><b>PTC heater / heat pump</b></td><td>Heats the cabin and sometimes the battery.</td><td>15</td></tr>
<tr><td><b>12 V battery</b></td><td>Powers computers, lights, locks — and wakes the car up. Without it, the HV system cannot start.</td><td>16</td></tr>
<tr><td><b>VCU</b> (vehicle control unit)</td><td>The master computer. Reads the pedals and decides how much torque to ask from the motor.</td><td>16</td></tr>
</tbody></table></div>

<aside class="c tip"><h4>Workshop tip — "x-in-1" units</h4><p>To save space and cost, makers combine parts into one housing. A "3-in-1" drive unit is motor + inverter + reduction gear. BYD's "8-in-1" adds the charger, DC-DC, PDU, VCU and BMS controller. For a technician this means fewer cables to check — but if one part fails, the whole expensive unit may need to come out.</p></aside>

<aside class="c"><h4>Key idea — the "three-electric" system</h4><p>Chinese trainers, manuals and parts suppliers group the main parts under one name: the <b>three-electric system</b> (三电, <em>sān diàn</em>).</p>
<ul><li><b>The "big three":</b> battery (电池), motor (电机) and electronic control (电控: the inverter and vehicle controller).</li>
<li><b>The "small three":</b> on-board charger (OBC), DC-DC converter and power distribution unit (PDU).</li></ul>
<p>You will hear this phrase on the first day of any course in China. It simply means the parts in Table 5.1.</p></aside>

<h3>5.4 How a hybrid differs</h3>
<p>A hybrid has all of the above (with a smaller battery in an HEV), <b>plus</b> a complete petrol engine with its fuel, exhaust, cooling and lubrication systems, and a special transmission that combines engine and motor. A hybrid is therefore <b>more</b> complicated than either a petrol car or a pure EV. Module 13 explains hybrids in detail.</p>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Battery under the floor, drive unit at the axle: the "skateboard".</li>
<li>Battery (DC) → inverter → motor (3-phase AC) → reduction gear → wheels.</li>
<li>Mains AC → on-board charger → battery.</li>
<li>The DC-DC converter replaces the alternator and keeps the 12 V battery charged.</li>
<li>Braking sends energy back to the battery through the same motor and inverter.</li></ul></aside>

<div class="quiz"><h3>Quiz 5</h3><p>Choose one answer for each question.</p><ol>
<li>Which component changes battery DC into three-phase AC for the motor?<ul><li>On-board charger</li><li>DC-DC converter</li><li data-c>Inverter</li><li>PDU</li></ul></li>
<li>What replaces the alternator in an electric car?<ul><li>The inverter</li><li data-c>The DC-DC converter</li><li>The on-board charger</li><li>The BMS</li></ul></li>
<li>What is the job of the on-board charger?<ul><li data-c>Convert AC from the mains to DC for the battery</li><li>Convert DC to AC for the motor</li><li>Cool the battery</li><li>Charge the 12 V battery from the HV battery</li></ul></li>
<li>Where is the battery pack in most modern EVs?<ul><li>Under the bonnet</li><li>In the boot</li><li data-c>Under the floor between the axles</li><li>On the roof</li></ul></li>
<li>During regenerative braking, the motor works as a…<ul><li>heater</li><li>charger for the mains</li><li data-c>generator</li><li>brake pad</li></ul></li>
<li>What is a "3-in-1" drive unit?<ul><li>Three motors in one housing</li><li data-c>Motor, inverter and reduction gear in one housing</li><li>Three batteries joined together</li><li>A charger with three plugs</li></ul></li>
</ol></div>

<template data-m="6" data-part="Part C · The battery" data-title="Battery cells and chemistry"><section class="mod">
<div class="mh"><div class="n">6</div><div><div class="pt">Part C · The battery</div><h2>Battery cells and chemistry</h2><p>The battery is the most expensive part of the car. It starts with a single cell.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>How a lithium-ion cell stores and releases energy</li>
<li>The main chemistries: LFP, NMC, NiMH and lead-acid</li>
<li>The shapes cells come in, including BYD's Blade</li>
<li>Why chemistry matters for safety, life and range</li></ul></div>

<h3>6.1 Inside a lithium-ion cell</h3>
<p>A cell has four main parts:</p>
<ul>
<li><b>Negative electrode (anode)</b> — graphite coated on copper foil.</li>
<li><b>Positive electrode (cathode)</b> — a lithium metal compound coated on aluminium foil. The compound gives the chemistry its name (LFP, NMC…).</li>
<li><b>Separator</b> — a very thin plastic sheet with tiny holes. It keeps the electrodes apart but lets lithium ions pass.</li>
<li><b>Electrolyte</b> — a liquid that carries the ions. It is flammable.</li>
</ul>
<figure>
<svg viewBox="0 0 720 280" role="img" aria-label="Cross-section of a lithium-ion cell during discharge">
<rect x="150" y="70" width="420" height="160" rx="8" fill="#F6F8F9" stroke="#1B2A33" stroke-width="2"/>
<rect x="160" y="80" width="18" height="140" fill="#C97B3C"/><rect x="178" y="80" width="110" height="140" class="kb"/>
<rect x="542" y="80" width="18" height="140" fill="#AEB8BF"/><rect x="432" y="80" width="110" height="140" class="gb"/>
<path d="M360 80 V220" stroke="#B7791F" stroke-width="5" stroke-dasharray="7 5"/>
<text x="233" y="110" class="m bd">Anode (−)</text><text x="233" y="126" class="m s">graphite</text>
<text x="487" y="110" class="m bd">Cathode (+)</text><text x="487" y="126" class="m s">LFP or NMC</text>
<text x="360" y="246" class="m s">Separator, soaked in electrolyte</text>
<g fill="#E8590C"><circle cx="250" cy="160" r="8"/><circle cx="310" cy="180" r="8"/><circle cx="330" cy="150" r="8"/><circle cx="400" cy="170" r="8"/><circle cx="210" cy="190" r="8"/></g>
<g class="m s bd w"><text x="250" y="164">Li⁺</text><text x="310" y="184">Li⁺</text><text x="330" y="154">Li⁺</text><text x="400" y="174">Li⁺</text><text x="210" y="194">Li⁺</text></g>
<path d="M280 200 H430" class="hv" style="stroke-width:2.5" marker-end="url(#ao)"/><text x="355" y="214" class="m s o">ions move inside the cell</text>
<path d="M169 80 V36 H300 M420 36 H551 V80" class="ln"/><rect x="300" y="20" width="120" height="32" rx="6" class="yb"/><text x="360" y="41" class="m bd">Motor (load)</text>
<path d="M190 28 H280" class="lv" marker-end="url(#ab)"/><text x="232" y="20" class="m s bl">electrons</text>
<path d="M440 28 H530" class="lv" marker-end="url(#ab)"/>
<text x="84" y="150" class="m s mu">copper foil</text><path d="M118 150 H158" class="ln" marker-end="url(#a)"/>
<text x="636" y="150" class="m s mu">aluminium foil</text><path d="M596 150 H562" class="ln" marker-end="url(#a)"/>
<text x="360" y="270" class="m s mu">Discharging shown. When charging, ions and electrons move the opposite way.</text>
</svg>
<figcaption><b>Figure 6.1</b> A lithium-ion cell while discharging. Lithium ions travel through the separator; electrons travel through the outside circuit and do the work.</figcaption></figure>
<p>When you <b>charge</b>, the charger pushes lithium ions from the cathode into the graphite anode. When you <b>discharge</b>, they flow back and the electrons flow round the outside circuit, driving the motor. Nothing is burned or used up — ions simply move back and forth. That is why the cell can be recharged thousands of times.</p>
<aside class="c danger"><h4>Danger</h4><p>If the separator is damaged — by a crash, a nail, a manufacturing fault or overheating — the two electrodes touch. This is an <b>internal short circuit</b>. The cell heats very quickly and can catch fire. Never drop, crush, puncture or open a lithium cell.</p></aside>

<h3>6.2 The main chemistries</h3>
<div class="tw"><table>
<caption>Table 6.1 — Battery chemistries you will meet</caption>
<thead><tr><th></th><th>LFP</th><th>NMC ("ternary")</th><th>NiMH</th><th>Lead-acid</th></tr></thead>
<tbody>
<tr><td><b>Full name</b></td><td>Lithium iron phosphate</td><td>Lithium nickel manganese cobalt oxide</td><td>Nickel-metal hydride</td><td>Lead-acid (incl. "graphene" type)</td></tr>
<tr><td><b>Nominal cell voltage</b></td><td>3.2 V</td><td>3.6–3.7 V</td><td>1.2 V</td><td>2.0 V</td></tr>
<tr><td><b>Working range per cell</b></td><td>2.5–3.65 V</td><td>3.0–4.2 V</td><td>1.0–1.5 V</td><td>1.75–2.4 V</td></tr>
<tr><td><b>Energy per kg</b></td><td>Medium (150–190 Wh/kg)</td><td>High (220–280 Wh/kg)</td><td>Low (60–80)</td><td>Very low (30–40)</td></tr>
<tr><td><b>Cycle life</b></td><td>Very long (3,000+)</td><td>Good (1,000–2,000)</td><td>Long in hybrid use</td><td>Short (300–500)</td></tr>
<tr><td><b>Fire safety</b></td><td>Best of the lithium types</td><td>Needs more protection</td><td>Good</td><td>Good (acid and gas hazards)</td></tr>
<tr><td><b>Cost</b></td><td>Lower</td><td>Higher</td><td>Medium</td><td>Lowest</td></tr>
<tr><td><b>Where used</b></td><td>All BYD cars (Blade), most affordable Chinese EVs and PHEVs</td><td>Deepal S07/L07, long-range and performance EVs, Korean EVs</td><td>Toyota Aqua, Prius, older hybrids</td><td>12 V batteries, cheap e-bikes and rickshaws</td></tr>
</tbody></table></div>

<h4>What this means in practice</h4>
<ul>
<li><b>LFP</b> is tough, safe and long-lived, and it tolerates being charged to 100% often. It stores less energy per kilogram, so the pack is heavier for the same range. Its voltage hardly changes between 20% and 90% charge, which makes it hard for the car to know the exact charge level; makers ask owners to charge to 100% regularly so the BMS can re-calibrate.</li>
<li><b>NMC</b> stores more energy in less weight, so it gives longer range and stronger power. It is less tolerant of heat and of sitting at 100% charge. Makers usually recommend charging to 80% for daily use. Chinese documents call it <b>NCM</b> or "ternary lithium" (三元锂); it is the same chemistry.</li>
<li><b>NiMH</b> is old but reliable. It is heavy and holds little energy, which is fine for a hybrid that only needs 1–2 kWh.</li>
<li><b>Lead-acid</b> is cheap and heavy and wears out quickly when deeply discharged.</li>
</ul>
<aside class="c pk"><h4>In Pakistan</h4><p>Our summers are hard on batteries. LFP copes with heat better than NMC, which is one reason it suits this market. But <b>no</b> lithium battery likes being parked in direct sun at 45 °C. Advising customers to park in shade is real, useful battery care.</p></aside>
<p><b>Coming next:</b> <em>sodium-ion</em> cells (cheaper, no lithium, lower energy) are starting to appear in small Chinese EVs and scooters. <em>Solid-state</em> cells, with no liquid electrolyte, are in development. The principles in this course apply to both.</p>

<h3>6.3 Cell shapes</h3>
<figure>
<svg viewBox="0 0 720 210" role="img" aria-label="Four cell formats: cylindrical, prismatic, pouch and blade">
<g><ellipse cx="90" cy="50" rx="30" ry="9" class="kb"/><path d="M60 50 V140 A30 9 0 0 0 120 140 V50" class="kb"/><rect x="82" y="36" width="16" height="8" class="db"/>
<text x="90" y="174" class="m bd">Cylindrical</text><text x="90" y="190" class="m s">like a large torch cell</text><text x="90" y="204" class="m s mu">Tesla, e-bikes</text></g>
<g><rect x="220" y="50" width="100" height="100" rx="5" class="lb"/><rect x="238" y="40" width="16" height="10" class="db"/><rect x="286" y="40" width="16" height="10" class="db"/>
<text x="270" y="174" class="m bd">Prismatic</text><text x="270" y="190" class="m s">hard aluminium can</text><text x="270" y="204" class="m s mu">most Chinese EVs</text></g>
<g><rect x="400" y="56" width="110" height="90" rx="12" fill="#D5DDE2" stroke="#5A6B76" stroke-width="1.5"/><rect x="418" y="44" width="22" height="12" fill="#C97B3C"/><rect x="470" y="44" width="22" height="12" fill="#AEB8BF"/>
<text x="455" y="174" class="m bd">Pouch</text><text x="455" y="190" class="m s">soft foil bag</text><text x="455" y="204" class="m s mu">Hyundai, Kia, some hybrids</text></g>
<g><rect x="560" y="86" width="140" height="22" rx="3" class="hb"/><rect x="552" y="92" width="8" height="10" class="db"/><rect x="700" y="92" width="8" height="10" class="db"/>
<text x="630" y="76" class="m s mu">about 96 cm long, 9 cm high</text>
<text x="630" y="174" class="m bd">Blade</text><text x="630" y="190" class="m s">long, thin prismatic LFP</text><text x="630" y="204" class="m s mu">BYD</text></g>
</svg>
<figcaption><b>Figure 6.2</b> Cell formats. The chemistry inside can be the same; only the packaging differs.</figcaption></figure>
<div class="tw"><table>
<thead><tr><th>Format</th><th>Strong points</th><th>Weak points</th></tr></thead>
<tbody>
<tr><td>Cylindrical</td><td>Cheap to make, strong case, easy to cool</td><td>Thousands of cells and welds in one pack</td></tr>
<tr><td>Prismatic</td><td>Large cells, fewer connections, easy to stack</td><td>Can swell with age</td></tr>
<tr><td>Pouch</td><td>Light, flexible shape</td><td>Easily damaged, swells, needs strong support</td></tr>
<tr><td>Blade</td><td>Cells act as structural beams; very good safety record in nail tests</td><td>Individual cells are hard to replace</td></tr>
</tbody></table></div>

<aside class="c sum"><h4>Summary</h4><ul>
<li>A lithium-ion cell has an anode, cathode, separator and electrolyte. Ions move inside; electrons do work outside.</li>
<li>LFP: 3.2 V, safer, longer life, heavier. NMC: 3.7 V, more energy, needs more care.</li>
<li>NiMH is used in Toyota hybrids. Lead-acid in 12 V batteries and cheap e-bikes.</li>
<li>Cells are cylindrical, prismatic, pouch or blade.</li>
<li>A damaged separator means an internal short and possible fire.</li></ul></aside>

<div class="quiz"><h3>Quiz 6</h3><p>Choose one answer for each question.</p><ol>
<li>What is the nominal voltage of one LFP cell?<ul><li>1.2 V</li><li>2.0 V</li><li data-c>3.2 V</li><li>12 V</li></ul></li>
<li>What is the job of the separator?<ul><li>Stores the lithium</li><li data-c>Keeps the electrodes apart while letting ions pass</li><li>Carries electrons to the motor</li><li>Cools the cell</li></ul></li>
<li>Which chemistry does BYD's Blade battery use?<ul><li>NMC</li><li>NiMH</li><li>Lead-acid</li><li data-c>LFP</li></ul></li>
<li>Compared with LFP, an NMC cell generally has…<ul><li data-c>more energy per kg but needs more care with heat and full charge</li><li>lower voltage and longer life</li><li>no fire risk</li><li>a lower price</li></ul></li>
<li>Which battery type is found in a Toyota Aqua hybrid?<ul><li>LFP</li><li>Lead-acid</li><li data-c>NiMH</li><li>Sodium-ion</li></ul></li>
<li>Why do makers ask owners of LFP cars to charge to 100% regularly?<ul><li>LFP is damaged below 100%</li><li data-c>Its flat voltage curve makes charge level hard to measure, so the BMS needs to re-calibrate</li><li>To heat the battery</li><li>To make the car faster</li></ul></li>
</ol></div>

<template data-m="7" data-part="Part C · The battery" data-title="Battery pack design and specifications"><section class="mod">
<div class="mh"><div class="n">7</div><div><div class="pt">Part C · The battery</div><h2>Battery pack design and specifications</h2><p>How hundreds of cells become one pack, and how to read the numbers that describe it.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>How cells are grouped into modules and packs</li>
<li>How to calculate pack voltage and energy</li>
<li>The meaning of SOC, SOH, C-rate and usable capacity</li>
<li>How packs are cooled, and the difference between 400 V and 800 V systems</li></ul></div>

<h3>7.1 Cell → module → pack</h3>
<figure>
<svg viewBox="0 0 720 220" role="img" aria-label="Cells are grouped into modules, modules into a pack">
<rect x="40" y="70" width="34" height="70" rx="4" class="hb"/><text x="57" y="164" class="m bd">Cell</text><text x="57" y="180" class="m s">3.2 V</text>
<path d="M90 105 H150" class="ln" marker-end="url(#a)"/>
<g class="hb"><rect x="170" y="70" width="14" height="70"/><rect x="186" y="70" width="14" height="70"/><rect x="202" y="70" width="14" height="70"/><rect x="218" y="70" width="14" height="70"/><rect x="234" y="70" width="14" height="70"/><rect x="250" y="70" width="14" height="70"/><rect x="266" y="70" width="14" height="70"/><rect x="282" y="70" width="14" height="70"/></g>
<rect x="164" y="62" width="138" height="86" rx="6" fill="none" stroke="#1B2A33" stroke-width="2"/>
<text x="233" y="164" class="m bd">Module</text><text x="233" y="180" class="m s">cells welded together</text><text x="233" y="194" class="m s">+ voltage and temperature sensors</text>
<path d="M320 105 H380" class="ln" marker-end="url(#a)"/>
<rect x="400" y="40" width="290" height="130" rx="10" fill="#F6F8F9" stroke="#1B2A33" stroke-width="2"/>
<g class="hb"><rect x="414" y="54" width="60" height="46" rx="3"/><rect x="480" y="54" width="60" height="46" rx="3"/><rect x="546" y="54" width="60" height="46" rx="3"/><rect x="414" y="108" width="60" height="46" rx="3"/><rect x="480" y="108" width="60" height="46" rx="3"/><rect x="546" y="108" width="60" height="46" rx="3"/></g>
<rect x="616" y="54" width="62" height="46" rx="3" class="yb"/><text x="647" y="74" class="m s bd">BMS</text><text x="647" y="88" class="m s">contactors</text>
<rect x="616" y="108" width="62" height="46" rx="3" class="lb"/><text x="647" y="128" class="m s bd">Cooling</text><text x="647" y="142" class="m s">plate</text>
<text x="545" y="190" class="m bd">Pack</text><text x="545" y="206" class="m s">sealed case, 300–800 V, 300–600 kg</text>
</svg>
<figcaption><b>Figure 7.1</b> The traditional build: cell, module, pack.</figcaption></figure>
<p>Newer designs remove steps to save weight and space:</p>
<ul>
<li><b>Cell-to-pack (CTP)</b> — no modules. Cells go straight into the pack. BYD Blade and many CATL packs do this.</li>
<li><b>Cell-to-body (CTB)</b> — the top of the pack is the floor of the car (BYD Seal).</li>
</ul>
<aside class="c tip"><h4>Workshop tip</h4><p>Older module-type packs can be repaired by swapping one bad module. CTP and CTB packs are much harder to repair at cell level; often the whole pack is exchanged. Knowing which type you have tells you what repair is realistic before you quote a price.</p></aside>

<h3>7.2 Pack voltage and energy</h3>
<p>Pack layout is written as <b>xS yP</b>: x groups in series, each group having y cells in parallel.</p>
<p style="text-align:center"><span class="f">Pack voltage = cells in series × cell voltage</span><br><span class="f">Pack capacity (Ah) = cells in parallel × cell Ah</span><br><span class="f">Pack energy (kWh) = pack voltage × pack Ah ÷ 1,000</span></p>
<aside class="c ex"><h4>Worked example — BYD Atto 3 (extended range)</h4>
<p>Published data: 126 Blade cells in series (126S1P), each 3.2 V and 150 Ah.</p>
<p>Voltage = 126 × 3.2 = <b>403.2 V</b><br>Energy = 403.2 × 150 ÷ 1,000 = <b>60.48 kWh</b> — exactly the figure on the brochure.</p></aside>
<aside class="c ex"><h4>Worked example — a typical NMC pack</h4>
<p>96S2P using 3.65 V, 78 Ah cells.</p>
<p>Nominal voltage = 96 × 3.65 = 350 V. Capacity = 2 × 78 = 156 Ah. Energy = 350 × 156 ÷ 1,000 = <b>54.6 kWh</b>.</p>
<p>Fully charged: 96 × 4.2 = <b>403 V</b>. Empty: 96 × 3.0 = <b>288 V</b>.</p></aside>
<aside class="c"><h4>Key idea</h4><p>Pack voltage is <b>not fixed</b>. It rises as the pack charges and falls as it empties. A "400 V" car may measure anything from about 290 V to 420 V. Always think in terms of <em>minimum, nominal and maximum</em> voltage.</p></aside>
<figure>
<svg viewBox="0 0 720 240" role="img" aria-label="Cell voltage against state of charge for LFP and NMC">
<path d="M70 20 V190 H690" class="ln"/>
<g class="s e"><text x="62" y="34">4.2 V</text><text x="62" y="76">3.7 V</text><text x="62" y="118">3.2 V</text><text x="62" y="176">2.5 V</text></g>
<g class="s m"><text x="70" y="208">0%</text><text x="225" y="208">25%</text><text x="380" y="208">50%</text><text x="535" y="208">75%</text><text x="690" y="208">100%</text></g>
<text x="380" y="230" class="m s bd">State of charge (SOC)</text>
<path d="M70 150 C90 110 110 100 160 92 C300 74 500 58 640 40 L690 30" class="lv" style="stroke-width:3"/>
<path d="M70 176 C80 130 95 122 130 119 C300 116 500 113 640 110 C670 108 682 96 690 78" class="hv" style="stroke-width:3"/>
<text x="150" y="62" class="bd bl">NMC — voltage climbs steadily</text>
<text x="330" y="140" class="bd o">LFP — almost flat from 20% to 90%</text>
</svg>
<figcaption><b>Figure 7.2</b> Cell voltage against state of charge. The flat LFP curve is why voltage alone cannot tell you the charge level of an LFP pack.</figcaption></figure>

<h3>7.3 The words used to describe a battery</h3>
<div class="tw"><table>
<thead><tr><th>Term</th><th>Meaning</th><th>Example</th></tr></thead>
<tbody>
<tr><td><b>SOC</b> — state of charge</td><td>How full the battery is now, in %</td><td>Like the fuel gauge: 80%</td></tr>
<tr><td><b>SOH</b> — state of health</td><td>Present full capacity compared with when new, in %</td><td>A 60 kWh pack that now holds 54 kWh has SOH 90%</td></tr>
<tr><td><b>DoD</b> — depth of discharge</td><td>How much has been used: 100% − SOC</td><td>SOC 30% = DoD 70%</td></tr>
<tr><td><b>Gross capacity</b></td><td>Total energy the cells can hold</td><td>64 kWh</td></tr>
<tr><td><b>Usable (net) capacity</b></td><td>The part the car lets you use. The rest is a hidden safety buffer at top and bottom.</td><td>60 kWh</td></tr>
<tr><td><b>C-rate</b></td><td>Charge or discharge current compared with capacity. 1C empties or fills the battery in 1 hour.</td><td>60 kWh pack at 120 kW = 2C</td></tr>
<tr><td><b>Cycle</b></td><td>One full charge and discharge (two half-charges count as one cycle)</td><td>LFP: 3,000+ cycles</td></tr>
<tr><td><b>Internal resistance</b></td><td>Resistance inside the cells. Causes heat and voltage drop under load. Rises with age and cold.</td><td>Milliohms per cell</td></tr>
</tbody></table></div>
<figure>
<svg viewBox="0 0 720 110" role="img" aria-label="Usable capacity window with buffers at top and bottom">
<rect x="40" y="30" width="40" height="40" class="rb"/><rect x="80" y="30" width="560" height="40" class="gb"/><rect x="640" y="30" width="40" height="40" class="rb"/>
<text x="360" y="55" class="m bd">Usable capacity — what the driver sees as 0% to 100%</text>
<text x="60" y="88" class="m s r">bottom buffer</text><text x="660" y="88" class="m s r">top buffer</text>
<path d="M40 16 H680" class="ln" marker-start="url(#a)" marker-end="url(#a)"/><text x="360" y="12" class="m s">Gross capacity</text>
</svg>
<figcaption><b>Figure 7.3</b> The car hides a small part of the battery at each end to protect the cells. "0%" on the dashboard is not truly empty.</figcaption></figure>
<aside class="c ex"><h4>Worked example — C-rate</h4>
<p>A 50 kWh pack is charged at a 100 kW fast charger. C-rate = 100 ÷ 50 = <b>2C</b>. In theory 0–100% in half an hour (in practice the car slows down above 80%).</p>
<p>The same pack on a 7 kW home charger: 7 ÷ 50 = 0.14C — very gentle, about 7 hours.</p></aside>

<h3>7.4 Battery power: why a small pack limits performance</h3>
<p>A battery can only supply a certain maximum current safely. Since <span class="f">P = V × I</span>, the battery has a <b>maximum power</b>, and the motor cannot use more than the battery can give.</p>
<ul>
<li>A <b>bigger pack</b> (more cells in parallel) can give more current, so more power.</li>
<li>A <b>cold, hot, old or nearly empty</b> pack can give less. The BMS tells the car to reduce power — the driver feels this as weak acceleration or sees a "tortoise" warning light.</li>
<li>Under heavy current, voltage sags: <span class="f">V<sub>drop</sub> = I × R<sub>internal</sub></span>. An aged pack with high internal resistance sags more and heats more.</li>
</ul>
<p>This is why a hybrid with a 1.5 kWh battery can only drive electrically at low power, while a 60 kWh BEV pack can deliver 150 kW easily. Module 11 returns to this.</p>

<h3>7.5 Keeping the pack at the right temperature</h3>
<p>Lithium cells are happiest between about <b>15 °C and 35 °C</b>. Too hot and they age quickly or become unsafe. Too cold and they give less power and cannot be charged quickly.</p>
<div class="tw"><table>
<caption>Table 7.1 — Battery cooling methods</caption>
<thead><tr><th>Method</th><th>How it works</th><th>Found on</th><th>Service points</th></tr></thead>
<tbody>
<tr><td><b>Air cooling</b></td><td>A fan blows cabin air through the pack</td><td>Toyota and Honda hybrids, older or cheaper EVs</td><td>Intake grille and filter under/behind the rear seat block with dust and pet hair → battery overheats. Very common fault.</td></tr>
<tr><td><b>Liquid cooling</b></td><td>Coolant flows through a plate under the cells, then to a radiator or a chiller on the A/C system</td><td>Most modern EVs and PHEVs</td><td>Coolant level and condition, pump, leaks, special low-conductivity coolant</td></tr>
<tr><td><b>Refrigerant (direct) cooling</b></td><td>A/C refrigerant flows directly through plates in the pack</td><td>BYD and some others</td><td>A/C system health directly affects the battery</td></tr>
</tbody></table></div>
<aside class="c pk"><h4>In Pakistan</h4><p>With 45 °C summers, battery cooling works very hard. A weak air-conditioning system is not only a comfort problem — on many EVs it will slow charging, cut power and shorten battery life. Dust is our other enemy: blocked battery fan filters on used Aqua and Prius cars are one of the most common causes of early hybrid battery failure here.</p></aside>

<h3>7.6 400 V and 800 V systems</h3>
<p>Most EVs today are called "400 V" (roughly 300–450 V). Newer high-end platforms use "800 V" (roughly 550–900 V).</p>
<ul>
<li><b>Advantage of 800 V:</b> half the current for the same power, so thinner cables, less heat, and much faster DC charging (250 kW and above).</li>
<li><b>Cost:</b> more cells in series, more expensive power electronics (silicon carbide), and stricter insulation.</li>
<li><b>For you:</b> the safety procedure is the same, but your meter and gloves must be rated for the voltage. A CAT III 1,000 V meter and Class 0 gloves cover both.</li>
</ul>

<h3>7.7 The pack case</h3>
<p>The pack is a sealed metal case, usually rated <b>IP67</b> (dust-tight and able to survive short immersion in water). On it you will find the HV connectors, low-voltage signal connector, coolant pipes, a pressure-relief vent, the service disconnect on many models, and a <b>data label</b>.</p>
<div class="tw"><table>
<caption>Table 7.2 — Reading a battery pack label (example)</caption>
<thead><tr><th>On the label</th><th>What it tells you</th></tr></thead>
<tbody>
<tr><td>Type: Li-ion (LFP)</td><td>Chemistry</td></tr>
<tr><td>Rated voltage: 403.2 V</td><td>Nominal pack voltage → 126 LFP cells in series</td></tr>
<tr><td>Rated capacity: 150 Ah</td><td>Pack amp-hours</td></tr>
<tr><td>Rated energy: 60.48 kWh</td><td>403.2 × 150 ÷ 1,000</td></tr>
<tr><td>Mass: 420 kg</td><td>You need a proper lifting table, not a trolley jack</td></tr>
<tr><td>Warning symbols</td><td>High voltage, do not open, do not burn, recycle</td></tr>
</tbody></table></div>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Cells → modules → pack, or cells straight to pack (CTP).</li>
<li>Voltage = series count × cell voltage. Energy = voltage × Ah.</li>
<li>Pack voltage moves between a minimum and maximum as SOC changes.</li>
<li>SOC = how full. SOH = how healthy. C-rate = how hard it is charged or discharged.</li>
<li>The battery limits the maximum power available to the motor.</li>
<li>Cooling is by air, liquid or refrigerant. Heat and dust are the big enemies in Pakistan.</li></ul></aside>

<div class="quiz"><h3>Quiz 7</h3><p>Choose one answer for each question.</p><ol>
<li>A pack has 100 LFP cells (3.2 V, 200 Ah) in series. What is its energy?<ul><li>32 kWh</li><li data-c>64 kWh</li><li>100 kWh</li><li>640 kWh</li></ul></li>
<li>A battery that held 50 kWh when new now holds 40 kWh. What is its SOH?<ul><li>40%</li><li>50%</li><li data-c>80%</li><li>125%</li></ul></li>
<li>A 40 kWh battery is charged at 80 kW. What is the C-rate?<ul><li>0.5C</li><li>1C</li><li data-c>2C</li><li>40C</li></ul></li>
<li>What does "usable capacity" mean?<ul><li>The capacity when the battery is old</li><li data-c>The part of the total capacity the car allows the driver to use</li><li>The capacity at 800 V</li><li>The 12 V battery capacity</li></ul></li>
<li>A used Toyota hybrid has an overheating battery. What simple thing should you check first?<ul><li>Engine oil</li><li>Tyre pressure</li><li data-c>Blocked battery cooling fan intake or filter</li><li>Wiper blades</li></ul></li>
<li>What is the main benefit of an 800 V system over a 400 V system?<ul><li>It is safer to touch</li><li>It needs no cooling</li><li data-c>Half the current for the same power, allowing faster charging and thinner cables</li><li>It uses fewer cells</li></ul></li>
</ol></div>
</section></template>
<template data-m="8" data-part="Part C · The battery" data-title="Battery management and protection"><section class="mod">
<div class="mh"><div class="n">8</div><div><div class="pt">Part C · The battery</div><h2>Battery management and protection</h2><p>The BMS, contactors and pre-charge circuit: how the pack looks after itself.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>What the battery management system (BMS) measures and controls</li>
<li>How contactors and the pre-charge circuit connect the battery to the car</li>
<li>What cell balancing is and why one weak cell limits the whole pack</li>
<li>What thermal runaway is, and what shortens battery life</li></ul></div>

<h3>8.1 What the BMS does</h3>
<p>A lithium cell is damaged by over-charging, over-discharging, too much current and extreme temperature. The <b>BMS</b> exists to stop these things happening.</p>
<div class="tw"><table>
<thead><tr><th>Job</th><th>How</th></tr></thead>
<tbody>
<tr><td><b>Measure</b></td><td>Voltage of every cell (or cell group), pack voltage, pack current, and temperatures at many points</td></tr>
<tr><td><b>Calculate</b></td><td>SOC, SOH, and how much power the pack can safely give or accept right now</td></tr>
<tr><td><b>Protect</b></td><td>Opens the contactors if voltage, current or temperature go outside safe limits</td></tr>
<tr><td><b>Balance</b></td><td>Keeps all cells at the same charge level</td></tr>
<tr><td><b>Control temperature</b></td><td>Requests cooling or heating</td></tr>
<tr><td><b>Monitor insulation</b></td><td>Checks resistance between the HV system and the car body</td></tr>
<tr><td><b>Communicate</b></td><td>Talks to the vehicle computer and the charger over CAN bus; stores fault codes</td></tr>
</tbody></table></div>
<p>The BMS usually has a <b>master</b> controller and several <b>slave</b> boards, one on each module or group of cells, which read the cell voltages and temperatures.</p>

<p><b>Contactors</b> are heavy-duty relays. They are opened and closed by 12 V signals from the BMS. When the car is off, all contactors are open and no voltage leaves the pack.</p>

<h4>Why pre-charge is needed</h4>
<p>The inverter contains a large capacitor. An empty capacitor behaves like a short circuit for an instant. If the main contactors closed straight onto it, a huge current would rush in and weld the contacts together.</p>
<aside class="c pic"><h4>Picture it — the canal gate</h4><p>Open a big gate suddenly onto a dry canal and the first rush of water tears at the banks. A careful operator opens a <b>small side gate</b> first, lets the canal fill gently, and only then lifts the main gate. Nothing rushes, because the levels are already equal. The pre-charge resistor is the small side gate; the inverter capacitor is the dry canal.</p></aside>
<p>So the car connects in stages:</p>
<ol class="steps">
<li><b>Main negative contactor closes.</b> Click.</li>
<li><b>Pre-charge contactor closes.</b> Current flows gently through the resistor and fills the capacitor. This takes a fraction of a second.</li>
<li><b>BMS checks the voltage</b> on the inverter side. When it reaches about 95% of pack voltage, pre-charge is complete.</li>
<li><b>Main positive contactor closes.</b> Click. The pre-charge contactor opens. The car shows <b>READY</b>.</li>
</ol>
<aside class="c tip"><h4>Workshop tip</h4><p>Listen when a car is switched to READY: you can hear the contactors click in sequence. If the voltage does not rise during pre-charge (for example, because of a short circuit or a failed resistor), the BMS stops and stores a <b>"pre-charge failure"</b> fault code. If a contactor has welded shut, the BMS will detect voltage where there should be none and refuse to start. These are common, logical faults you will learn to diagnose.</p></aside>

<h3>8.3 Cell balancing: the weakest cell rule</h3>
<p>Cells in series are like links in a chain. All carry the same current. But no two cells are perfectly identical; over time some hold slightly more charge than others.</p>
<figure>
<svg viewBox="0 0 720 230" role="img" aria-label="Unbalanced cells limit charging and discharging; balanced cells give full capacity">
<text x="180" y="22" class="m bd">Unbalanced pack</text>

<p><b>Balancing</b> corrects this. In <em>passive</em> balancing (the common type), the BMS switches a small resistor across the highest cells to bleed off a little charge, usually near the end of charging. In <em>active</em> balancing, charge is moved from high cells to low cells.</p>
<aside class="c"><h4>Key idea</h4><p>On a scan tool, look at the <b>difference between the highest and lowest cell voltage</b>. A healthy pack at rest shows a spread of a few millivolts (for example under 0.02–0.03 V). A large spread, or one cell that drops quickly under load, points to a failing cell or module. This single reading is one of the most useful in battery diagnosis.</p></aside>

<h3>8.4 Insulation monitoring</h3>
<p>Remember that the HV system is insulated from the car body. The BMS (or a separate unit) keeps measuring the resistance between HV+ and the body, and HV− and the body. Healthy values are in <b>megohms</b>. Regulations require at least 100 Ω per volt for DC parts and 500 Ω per volt where AC is present — for a 400 V car that is 40 kΩ to 200 kΩ as an absolute minimum.</p>
<p>If the resistance falls — because of water, damaged cable insulation, coolant leaking into the pack, or a failed A/C compressor — the car logs an <b>"insulation fault"</b> (also called isolation fault or leakage fault) and may refuse to drive or charge. Finding these is a core EV diagnostic skill (Module 18).</p>

<h3>8.5 Thermal runaway</h3>
<p><b>Thermal runaway</b> is when a cell heats itself faster than it can cool. Heat triggers chemical reactions that make more heat. The cell vents hot, toxic, flammable gas and may burn, and the heat can spread to the next cell.</p>
<div class="two">
<div><h4>Causes</h4><ul><li>Crash or impact damage from below</li><li>Internal short from a manufacturing defect</li><li>Over-charging (failed BMS or wrong charger)</li><li>External short circuit</li><li>Outside fire or extreme heat</li><li>Water inside the pack</li></ul></div>
<div><h4>Warning signs</h4><ul><li>Sweet, solvent-like or burning smell</li><li>Hissing or popping from the pack</li><li>White or grey "smoke" (vent gas)</li><li>Pack case hot to the back of the hand</li><li>Swollen case or modules</li><li>Battery temperature warning on dash</li></ul></div>
</div>
<aside class="c danger"><h4>Danger</h4><p>If you see any of these signs: stop work, move people away, move the car outside if it is safe to do so, and call the fire service. Do not try to open the pack. LFP is much harder to push into runaway than NMC, but <b>no chemistry is immune</b>.</p></aside>

<h3>8.6 What makes a battery age</h3>
<p>All batteries slowly lose capacity. A well-treated EV battery typically keeps more than 80% after 8–10 years. These things speed up ageing:</p>
<div class="tw"><table>
<thead><tr><th>Bad for the battery</th><th>Advice you can give customers</th></tr></thead>
<tbody>
<tr><td>High temperature</td><td>Park in shade or a garage. Keep the cooling system serviced.</td></tr>
<tr><td>Sitting at 100% for long periods (especially NMC)</td><td>For daily use charge NMC to 80%. Charge to 100% just before a long trip. Follow the maker's advice for LFP.</td></tr>
<tr><td>Sitting near 0%</td><td>Do not leave the car parked empty. Store at 40–60% if leaving it for weeks.</td></tr>
<tr><td>Frequent DC fast charging</td><td>Use home AC charging for normal days; fast chargers for journeys.</td></tr>
<tr><td>Poor-quality or wrong chargers</td><td>Especially on e-bikes: use the correct charger for the battery.</td></tr>
</tbody></table></div>

<h3>8.7 Inside a battery repair: what gets measured</h3>

<h4>Why cells must be matched</h4>
<p>A replacement module or cell must match the others in <b>capacity, internal resistance and state of charge</b>. A new, strong cell among old, tired ones does not rescue the pack: the pack is still limited by the weakest cell, and the mismatch makes balancing harder. This is "grading and matching", and it is why a proper repair measures every cell and does not simply swap the one that failed.</p>

<aside class="c sum"><h4>Summary</h4><ul>
<li>The BMS measures every cell, calculates SOC and SOH, protects, balances and communicates.</li>
<li>Contactors connect the pack to the car. Pre-charge fills the inverter capacitor gently first.</li>
<li>A pack is limited by its weakest cell. Check the cell voltage spread.</li>
<li>Insulation monitoring watches for leakage between HV and the body.</li>
<li>Thermal runaway is rare but serious. Know the warning signs.</li>
<li>Heat, extreme SOC and constant fast charging shorten battery life.</li></ul></aside>

<div class="quiz"><h3>Quiz 8</h3><p>Choose one answer for each question.</p><ol>

<div class="mh"><div class="n">9</div><div><div class="pt">Part D · The electric drive</div><h2>Electric motors</h2><p>How a motor turns electricity into motion, and the types used in cars, bikes and rickshaws.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>The basic principle of every electric motor</li>

<h3>9.1 The principle</h3>
<p>You know that magnets push and pull each other: like poles repel, unlike poles attract. You also know from school that a coil of wire carrying current becomes a magnet (an <b>electromagnet</b>), and that you can reverse its poles by reversing the current.</p>
<p>A motor uses these two facts. The outer part, the <b>stator</b>, has coils of copper wire. The inner part, the <b>rotor</b>, has magnets. By switching current through the stator coils in the right order, we create a magnetic field that <b>rotates</b> around the stator. The rotor magnets are dragged round with it. That rotation is what turns the wheels.</p>
<aside class="c pic"><h4>Picture it — the donkey and the carrot</h4><p>Hold a carrot on a stick in front of a donkey and walk in a circle: the donkey follows the carrot round and round. The stator's rotating magnetic field is the carrot. The rotor magnets are the donkey. Move the carrot faster (higher frequency) and the donkey turns faster. That is all a motor is.</p></aside>
<p>Three-phase AC (Module 2) is perfect for this: three sets of coils, fed by three currents one-third of a cycle apart, naturally produce a smoothly rotating field.</p>

<path d="M225 150 L400 196" class="ln"/><text x="406" y="192" class="bd">Rotor with permanent magnets</text><text x="406" y="207">turns with the rotating field</text>
<path d="M186 147 L400 246" class="ln"/><text x="406" y="242" class="bd">Shaft</text><text x="406" y="257">connects to the reduction gear</text></g>
<text x="330" y="100" class="s g bd">rotating field</text>
</svg>
<figcaption><b>Figure 9.1</b> A permanent-magnet motor in cross-section. The gap between rotor and stator is less than a millimetre.</figcaption></figure>

<h3>9.2 Parts of a traction motor</h3>
<div class="tw"><table>
<thead><tr><th>Part</th><th>Description</th></tr></thead>
<tbody>
<tr><td><b>Stator</b></td><td>Stack of thin steel sheets with copper windings in slots. Modern motors use flat "hairpin" copper bars instead of round wire.</td></tr>
<tr><td><b>Rotor</b></td><td>Steel core carrying magnets (or aluminium/copper bars in an induction motor). Mounted on the shaft.</td></tr>
<tr><td><b>Bearings</b></td><td>Support the shaft at each end. They spin at up to 16,000–20,000 rpm.</td></tr>
<tr><td><b>Housing and cooling</b></td><td>Aluminium case with a water jacket around the stator, or oil sprayed directly on the windings.</td></tr>
<tr><td><b>Resolver</b> (position sensor)</td><td>Tells the inverter the exact angle of the rotor so it can switch the coils at the right instant.</td></tr>
<tr><td><b>Temperature sensors</b></td><td>Buried in the windings. If the motor overheats, power is reduced.</td></tr>
<tr><td><b>Three-phase terminals</b></td><td>Three thick orange cables or bus bars (U, V, W) from the inverter.</td></tr>
</tbody></table></div>

<h3>9.3 Motor types</h3>
<div class="tw"><table>
<caption>Table 9.1 — Traction motor types</caption>
<thead><tr><th>Type</th><th>How the rotor works</th><th>Good</th><th>Less good</th><th>Used in</th></tr></thead>
<tbody>
<tr><td><b>PMSM</b><br>Permanent-magnet synchronous motor</td><td>Strong rare-earth magnets in the rotor. Rotor turns exactly in step with the field.</td><td>Most efficient (up to 97%), small, powerful</td><td>Magnets are expensive; generates voltage whenever it spins</td><td>Almost all EVs and hybrids: BYD, Deepal, MG, Toyota, Honda, Hyundai</td></tr>
<tr><td><b>Induction motor</b><br>(asynchronous)</td><td>No magnets. Aluminium or copper bars in the rotor; the stator field <em>induces</em> current in them.</td><td>Simple, robust, cheap, no drag when not powered</td><td>Slightly less efficient, rotor runs hotter</td><td>Some Tesla and Audi motors; second axle of some AWD EVs; many industrial motors</td></tr>
<tr><td><b>BLDC hub motor</b><br>Brushless DC</td><td>Permanent magnets on a rotor built into the wheel. Simple Hall sensors for position.</td><td>Very simple, no gearbox or chain</td><td>Heavy wheel, lower efficiency, limited power</td><td>E-bikes, scooters, some rickshaws</td></tr>
<tr><td><b>Wound-rotor synchronous</b> (EESM)</td><td>Rotor is an electromagnet fed through slip rings</td><td>No rare-earth magnets</td><td>Brushes or extra parts wear</td><td>Some BMW and Renault EVs</td></tr>
</tbody></table></div>
<aside class="c danger"><h4>Danger — a spinning motor is a generator</h4><p>A permanent-magnet motor produces voltage at its terminals <b>whenever the rotor turns</b>, even with the battery disconnected. If the driven wheels are turned — by towing, pushing fast, or spinning a wheel on a lift — the orange cables can become live. Never turn the wheels of an EV with HV parts exposed.</p></aside>

<h3>9.4 The torque–speed curve</h3>
<p><b>Torque</b> is turning force, measured in <b>newton-metres (Nm)</b>. This graph is the single most important picture for understanding how an EV drives.</p>
<figure>
<svg viewBox="0 0 720 280" role="img" aria-label="Torque and power against speed for an electric motor compared with a petrol engine">
<path d="M70 20 V220 H690" class="ln"/>
<path d="M70 60 H250 C320 110 460 165 670 186" class="hv" style="stroke-width:3.5"/>
<path d="M70 220 L250 84 H670" class="lv" style="stroke-width:3.5"/>
<path d="M112 170 C190 120 300 108 380 112 S470 140 500 176" stroke="#5A6B76" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
<path d="M250 20 V220" class="ln da"/>
<text x="160" y="50" class="m bd o">Motor torque</text><text x="560" y="74" class="m bd bl">Motor power</text>
<text x="262" y="150" class="s mu bd">Petrol engine torque</text>
<text x="160" y="246" class="m s bd">Constant-torque region</text><text x="160" y="262" class="m s">full torque from 0 rpm</text>
<text x="470" y="246" class="m s bd">Constant-power region</text><text x="470" y="262" class="m s">torque falls as speed rises</text>
<text x="250" y="14" class="m s bd">base speed</text>
