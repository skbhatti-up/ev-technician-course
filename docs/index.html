<ul>
<li>From 0 rpm up to the <b>base speed</b>, the motor can give its <b>maximum torque</b>. The limit here is the maximum current the inverter and battery can supply. Power rises steadily with speed.</li>
<li>Above base speed, the motor has reached its <b>maximum power</b>. The limit here is voltage. Power stays roughly level, so torque must fall as speed rises.</li>
</ul>
<p>This is why an EV feels so quick away from traffic lights, and why it needs only one gear.</p>

<h3>9.5 Motor ratings on a specification sheet</h3>
<ul>
<li><b>Peak power (kW)</b> — the maximum, available for a short time (typically 30 seconds). This is the advertised figure.</li>
<li><b>Continuous (rated) power (kW)</b> — what it can give all day without overheating. Often about half the peak.</li>
<li><b>Peak torque (Nm)</b> — maximum turning force.</li>
<li><b>Maximum speed (rpm)</b> — typically 14,000–20,000.</li>
</ul>

<h3>9.6 What goes wrong with motors</h3>
<div class="tw"><table>
<thead><tr><th>Fault</th><th>Symptom</th><th>Typical cause</th></tr></thead>
<tbody>
<tr><td>Bearing wear</td><td>Whine or rumble that changes with road speed</td><td>High mileage; electrical currents through the bearing; water</td></tr>
<tr><td>Resolver fault</td><td>Jerky drive, no drive, warning light, fault code</td><td>Sensor, connector or wiring problem</td></tr>
<tr><td>Winding insulation breakdown</td><td>Insulation fault code; car will not go READY</td><td>Overheating, coolant or water inside the motor</td></tr>
<tr><td>Coolant leak into motor</td><td>Insulation fault, coolant loss with no visible leak</td><td>Internal seal failure</td></tr>
<tr><td>Oil seal leak</td><td>Gear oil at the drive unit joint</td><td>Seal wear</td></tr>
<tr><td>Overheating</td><td>Reduced power in hot weather or on hills</td><td>Low coolant, failed pump, blocked radiator</td></tr>
</tbody></table></div>
<p>Motor windings are tested (with the HV system safely isolated) in two ways: the <b>resistance between phases</b> should be equal on all three pairs, and the <b>insulation resistance</b> from windings to the case, measured with an insulation tester, should be very high. Module 17 covers the tools.</p>

<aside class="c sum"><h4>Summary</h4><ul>
<li>A rotating magnetic field in the stator pulls the rotor round.</li>
<li>PMSM is the standard car motor. Induction motors have no magnets. BLDC hub motors drive bikes.</li>
<li>Full torque from zero speed up to base speed; constant power above it.</li>
<li>A resolver tells the inverter the rotor position.</li>
<li>A turning permanent-magnet motor generates voltage — never spin the wheels with HV parts exposed.</li></ul></aside>

<div class="quiz"><h3>Quiz 9</h3><p>Choose one answer for each question.</p><ol>
<li>Which part of the motor carries the copper windings and does not move?<ul><li>Rotor</li><li data-c>Stator</li><li>Resolver</li><li>Shaft</li></ul></li>

<li>What does the resolver do?<ul><li>Cools the motor</li><li data-c>Measures the rotor's position</li><li>Converts DC to AC</li><li>Stores energy</li></ul></li>

<template data-m="10" data-part="Part D · The electric drive" data-title="Power electronics"><section class="mod">
<div class="mh"><div class="n">10</div><div><div class="pt">Part D · The electric drive</div><h2>Power electronics</h2><p>The boxes that convert and control electrical power: inverter, DC-DC converter, on-board charger and PDU.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>How an inverter makes three-phase AC from battery DC</li>
<li>How the inverter controls motor speed and torque</li>
<li>What the DC-DC converter, on-board charger and PDU do</li>
<li>Common faults and simple checks</li></ul></div>

<h3>10.1 The inverter</h3>
<p>The inverter (also called motor control unit, MCU, or power control unit, PCU) sits between the battery and the motor. Inside are <b>six fast electronic switches</b> arranged in three pairs — one pair for each motor phase.</p>
<figure>
<svg viewBox="0 0 720 270" role="img" aria-label="Inverter circuit with six switches between battery and three-phase motor">
<rect x="30" y="80" width="70" height="100" rx="6" class="hb"/><text x="65" y="126" class="m bd">Battery</text><text x="65" y="144" class="m s">400 V DC</text>

<h4>How switching makes AC</h4>
<p>The switches can only be fully on or fully off. To make a smooth AC wave, the inverter turns them on and off very quickly (around 5,000–20,000 times per second) and varies how long each pulse lasts. Wide pulses give a high average voltage; narrow pulses give a low one. This is <b>pulse-width modulation (PWM)</b>. The motor windings smooth the pulses into a near-perfect sine-wave current.</p>
<figure>
<svg viewBox="0 0 720 190" role="img" aria-label="Pulse width modulation: pulses of varying width produce a sine wave current">
<path d="M50 95 H680" class="ln"/>

<aside class="c pic"><h4>Picture it — the tap you can only open fully</h4><p>Imagine a tap that can only be fully open or fully shut, filling a bucket with a small hole in it. Open it for long bursts and the water level rises; open it for short bursts and the level falls. By changing only the <b>length of the bursts</b>, you can hold the water at any level you like. The inverter's switches are that tap, and the level in the bucket is the voltage the motor feels.</p></aside>
<aside class="c"><h4>Key idea — how the driver's foot controls the motor</h4><p>The inverter controls two things:<br>• The <b>frequency</b> of the AC sets the motor <b>speed</b>.<br>• The <b>current</b> (amplitude) sets the motor <b>torque</b>.<br>Press the accelerator → the vehicle computer asks for more torque → the inverter sends more current. To reverse, it simply swaps the order of the phases.</p></aside>

<h4>Inside the inverter</h4>
<ul>
<li><b>Power module</b> — the six switches. Older and cheaper designs use <b>IGBTs</b> (silicon). Newer ones use <b>SiC MOSFETs</b> (silicon carbide), which waste less energy as heat and are essential for 800 V systems.</li>
<li><b>DC-link capacitor</b> — a large capacitor across the DC input that smooths the supply. <b>It stores a dangerous charge.</b></li>
<li><b>Gate driver and control board</b> — the electronics that decide when to fire each switch.</li>
<li><b>Current sensors</b> — on the phase outputs.</li>
<li><b>Cooling plate</b> — coolant flows under the power module.</li>
</ul>
<aside class="c danger"><h4>Danger</h4><p>The DC-link capacitor holds battery voltage after switch-off until the discharge circuit drains it. This is the reason for the waiting time in the isolation procedure, and the reason you <b>measure</b> before touching.</p></aside>

<h3>10.2 The DC-DC converter</h3>
<p>A petrol car has an alternator driven by the engine to charge the 12 V battery. An EV has no alternator. Instead a <b>DC-DC converter</b> takes high voltage from the main battery and steps it down to about <b>13.5–14.8 V</b>. Typical output is 1.5–3 kW (over 100 A).</p>
<aside class="c tip"><h4>Workshop tip — a simple, safe test</h4><p>Measure the 12 V battery voltage with the car <b>off</b> (expect about 12.4–12.8 V) and again with the car in <b>READY</b> (expect about 13.5–14.8 V). If the voltage does not rise in READY, the DC-DC converter is not charging. This is a low-voltage test you can do without touching any orange cable.</p></aside>

<h3>10.3 The on-board charger (OBC)</h3>
<p>The battery needs DC. The mains supplies AC. The <b>on-board charger</b> converts one to the other when you plug into an AC socket or wallbox. Its power rating sets the <b>maximum AC charging speed</b>:</p>
<div class="tw"><table>
<thead><tr><th>OBC rating</th><th>Supply needed</th><th>Time to add 50 kWh</th></tr></thead>
<tbody><tr><td>3.3 kW</td><td>Single-phase, 16 A</td><td>about 15 hours</td></tr>
<tr><td>6.6–7 kW</td><td>Single-phase, 32 A</td><td>about 7.5 hours</td></tr>
<tr><td>11 kW</td><td>Three-phase, 16 A per phase</td><td>about 4.5 hours</td></tr>
<tr><td>22 kW</td><td>Three-phase, 32 A per phase</td><td>about 2.5 hours</td></tr></tbody></table></div>
<p>During <b>DC fast charging</b> the big converter is inside the charging station, and current goes straight to the battery. The on-board charger is bypassed (Module 14).</p>
<p>Many Chinese EVs have a <b>bidirectional</b> charger that can also work backwards, giving 230 V AC from the car battery through an adapter. This is called <b>V2L</b> (vehicle-to-load).</p>
<aside class="c pk"><h4>In Pakistan</h4><p>V2L is a real selling point here: during load-shedding an EV can run fans, lights, a fridge or tools for many hours. Customers will ask you about it. They may also damage it by overloading it or using poor-quality adapters, which gives you repair work.</p></aside>

<h3>10.4 The power distribution unit (PDU)</h3>
<p>The PDU is the HV junction box. From the battery, power is shared out — through fuses and sometimes relays — to the inverter, on-board charger, DC-DC converter, A/C compressor and heater. When one HV consumer stops working (for example the A/C compressor), a blown HV fuse in the PDU is a possible cause. HV fuses are only checked or changed with the system isolated and proven dead.</p>

<h3>10.5 The boost converter in Toyota hybrids</h3>
<p>Toyota hybrid batteries are only about 150–250 V. To make the motors more powerful and efficient, a <b>boost converter</b> inside the inverter assembly raises this to as much as 600–650 V for the motors. So the voltage inside a Toyota inverter is far higher than the battery voltage written on the label.</p>

<h3>10.6 Cooling and common faults</h3>
<p>Power electronics are about 95–98% efficient, but 2–5% of 150 kW is still several kilowatts of heat. They share a coolant loop with an electric pump and a radiator.</p>
<div class="tw"><table>
<thead><tr><th>Fault</th><th>Symptom</th><th>First checks</th></tr></thead>
<tbody>
<tr><td>Inverter overheating</td><td>Power reduced, warning light, worse in summer</td><td>Coolant level, electric coolant pump running, air in system, radiator blocked</td></tr>
<tr><td>Failed inverter coolant pump</td><td>Same as above; fault code for pump</td><td>12 V supply and fuse to pump; pump noise; coolant movement in the reservoir</td></tr>
<tr><td>DC-DC failure</td><td>12 V battery goes flat; many warning lights; car dies while driving</td><td>12 V voltage in READY (see tip above)</td></tr>
<tr><td>OBC failure</td><td>Will not charge on AC but charges on DC</td><td>Try another cable and socket first; read fault codes</td></tr>
<tr><td>Power module failure</td><td>No drive, HV fuse may blow, fault codes</td><td>Specialist diagnosis; usually unit replacement</td></tr>
</tbody></table></div>
<aside class="c tip"><h4>Workshop tip</h4><p>On older Toyota hybrids, a failed <b>inverter coolant pump</b> is a classic fault. It is cheap. If ignored, it destroys the inverter, which is not cheap. Checking that the coolant in the inverter reservoir is moving (with the car in READY) takes ten seconds.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>The inverter uses six switches and PWM to turn DC into three-phase AC.</li>
<li>Frequency sets speed; current sets torque.</li>
<li>The DC-DC converter charges the 12 V system: expect 13.5–14.8 V in READY.</li>
<li>The on-board charger converts mains AC to DC and sets the AC charging speed.</li>
<li>The PDU distributes and fuses the high voltage.</li>
<li>Power electronics need liquid cooling. Check coolant and pumps first.</li></ul></aside>

<div class="quiz"><h3>Quiz 10</h3><p>Choose one answer for each question.</p><ol>
<li>How many main power switches does a three-phase inverter have?<ul><li>2</li><li>3</li><li data-c>6</li><li>12</li></ul></li>
<li>To make the motor produce more torque, the inverter increases the…<ul><li>frequency</li><li data-c>current</li><li>battery capacity</li><li>gear ratio</li></ul></li>
<li>With the car in READY, the 12 V battery measures 12.1 V and is falling. What is the likely fault?<ul><li>On-board charger</li><li>Resolver</li><li data-c>DC-DC converter not charging</li><li>Tyre pressure sensor</li></ul></li>
<li>A car charges at a DC fast charger but not from an AC wallbox. Which part is suspect?<ul><li>Inverter</li><li data-c>On-board charger</li><li>Motor</li><li>Reduction gear</li></ul></li>
<li>Why must you wait after switching off before working on the inverter?<ul><li>To let the motor cool</li><li data-c>The DC-link capacitor holds a dangerous charge until it is discharged</li><li>To let the coolant settle</li><li>To save the 12 V battery</li></ul></li>
<li>What is V2L?<ul><li>A type of battery cell</li><li>A fast-charging plug</li><li data-c>Using the car's battery to power 230 V AC appliances</li><li>A two-speed gearbox</li></ul></li>
</ol></div>
</section></template>
<template data-m="11" data-part="Part D · The electric drive" data-title="Performance: how battery and motor shape the car"><section class="mod">
<div class="mh"><div class="n">11</div><div><div class="pt">Part D · The electric drive</div><h2>Performance: how battery and motor shape the car</h2><p>Acceleration, top speed, range and running cost — and the numbers behind them.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>How torque, power and speed are related</li>
<li>How motor power and battery power together limit acceleration</li>
<li>How battery energy and consumption decide range</li>
<li>Why real range differs from the brochure, and how to explain it to customers</li></ul></div>

<h3>11.1 Torque, speed and power</h3>
<p>Power is torque multiplied by rotational speed. In workshop units:</p>
<p style="text-align:center;font-size:1.15em"><span class="f">Power (kW) = Torque (Nm) × Speed (rpm) ÷ 9,550</span></p>
<aside class="c ex"><h4>Worked example</h4>
<p>A motor makes 310 Nm at 4,600 rpm. Power = 310 × 4,600 ÷ 9,550 = <b>149 kW</b>.</p>
<p>The same motor at 12,000 rpm can still make about 150 kW, so its torque there is 150 × 9,550 ÷ 12,000 = <b>119 Nm</b>. Same power, much less torque — the constant-power region from Figure 9.2.</p></aside>
<ul>
<li><b>Torque</b> (multiplied by the gear ratio) decides how hard the car pushes off from rest and at low speed.</li>
<li><b>Power</b> decides how well it keeps accelerating at higher speed, how it climbs long hills, and its top speed.</li>
</ul>

<h3>11.2 From motor torque to acceleration</h3>
<aside class="c ex"><h4>Worked example — why EVs launch so hard</h4>
<p>Motor torque 310 Nm. Reduction gear ratio 10:1. Wheel radius 0.33 m. Car mass 1,750 kg.</p>
<p>1. Torque at the wheels = 310 × 10 = 3,100 Nm (ignoring small losses)<br>
2. Driving force = torque ÷ wheel radius = 3,100 ÷ 0.33 ≈ 9,400 N<br>
3. Acceleration = force ÷ mass = 9,400 ÷ 1,750 ≈ <b>5.4 m/s²</b></p>
<p>That is more than half of gravity, available instantly from 0 km/h. A typical family petrol car manages about half of this in first gear, and only once the engine has revved up.</p></aside>

<h3>11.3 The weakest link sets the limit</h3>
<figure>
<svg viewBox="0 0 720 170" role="img" aria-label="Chain of components that limit performance from battery to tyres">
<g><rect x="16" y="40" width="120" height="70" rx="8" class="hb"/><text x="76" y="66" class="m bd">Battery</text><text x="76" y="84" class="m s">max current</text><text x="76" y="98" class="m s">× voltage</text></g>
<g><rect x="158" y="40" width="120" height="70" rx="8" class="yb"/><text x="218" y="66" class="m bd">Inverter</text><text x="218" y="84" class="m s">max phase</text><text x="218" y="98" class="m s">current</text></g>
<g><rect x="300" y="40" width="120" height="70" rx="8" class="gb"/><text x="360" y="66" class="m bd">Motor</text><text x="360" y="84" class="m s">max torque,</text><text x="360" y="98" class="m s">power, heat</text></g>
<g><rect x="442" y="40" width="120" height="70" rx="8" class="kb"/><text x="502" y="66" class="m bd">Gearing</text><text x="502" y="84" class="m s">ratio trades</text><text x="502" y="98" class="m s">torque for speed</text></g>
<g><rect x="584" y="40" width="120" height="70" rx="8" class="db"/><text x="644" y="66" class="m bd w">Tyres</text><text x="644" y="84" class="m s w">grip on</text><text x="644" y="98" class="m s w">the road</text></g>
<path d="M136 75 H154" class="ln" marker-end="url(#a)"/><path d="M278 75 H296" class="ln" marker-end="url(#a)"/><path d="M420 75 H438" class="ln" marker-end="url(#a)"/><path d="M562 75 H580" class="ln" marker-end="url(#a)"/>
<text x="360" y="24" class="m s bd">Power flows left to right. The smallest limit in the chain decides what reaches the road.</text>
<text x="360" y="140" class="m s mu">The BMS and vehicle computer watch all of these and reduce the torque request when any one reaches its limit.</text>
</svg>
<figcaption><b>Figure 11.1</b> The performance chain.</figcaption></figure>

<h4>How the battery limits power</h4>
<p>The motor may be rated at 150 kW, but it can only deliver what the battery can supply.</p>
<aside class="c ex"><h4>Worked example</h4>
<p>A 60 kWh pack at 400 V can safely give 400 A. Maximum battery power = 400 × 400 = <b>160 kW</b>. The 150 kW motor can be fully used.</p>
<p>Now the same motor with a small 20 kWh pack of the same cells: one-third of the cells in parallel, so about 133 A. Maximum = 400 × 133 = <b>53 kW</b>. The motor is still a 150 kW motor, but the car performs like a 53 kW car.</p></aside>
<p>This explains several things you will see:</p>
<ul>
<li><b>Long-range versions are often faster.</b> A bigger battery can supply more current, so the maker fits or unlocks a more powerful motor.</li>
<li><b>Hybrids need "power cells".</b> An HEV battery of 1.5 kWh giving 40 kW is working at about 27C. These cells are designed for high power, not high energy.</li>
<li><b>PHEVs feel strongest with charge in the battery.</b> With the battery depleted, less electrical power is available to help the engine.</li>
<li><b>Power is reduced when the battery is cold, very hot, nearly empty or aged.</b> Internal resistance is higher, so the BMS lowers the current limit. The customer complains of "low power"; the scan tool shows the BMS limit as the reason.</li>
</ul>
<aside class="c"><h4>Key idea</h4><p><b>Motor kW</b> is what the car <em>could</em> do. <b>Battery kW</b> (which depends on battery size, chemistry, temperature, charge level and health) is what it is <em>allowed</em> to do right now. Performance is whichever is lower.</p></aside>

<h3>11.4 Power-to-weight</h3>
<p>A heavy car needs more power for the same acceleration. Dividing power by mass gives a quick comparison.</p>
<div class="tw"><table>
<caption>Table 11.1 — Power-to-weight examples (approximate figures)</caption>
<thead><tr><th>Car</th><th>Power</th><th>Mass</th><th>kW per tonne</th><th>0–100 km/h</th></tr></thead>
<tbody>
<tr><td>Toyota Corolla Cross HEV</td><td>90 kW</td><td>1,400 kg</td><td>64</td><td>about 11 s</td></tr>
<tr><td>BYD Atto 3</td><td>150 kW</td><td>1,750 kg</td><td>86</td><td>7.3 s</td></tr>
<tr><td>Deepal S07</td><td>190 kW</td><td>2,000 kg</td><td>95</td><td>about 7 s</td></tr>
<tr><td>BYD Seal AWD (two motors)</td><td>390 kW</td><td>2,185 kg</td><td>178</td><td>3.8 s</td></tr>
</tbody></table></div>
<p><b>All-wheel-drive EVs</b> have a motor on each axle. Their powers add together, and four driven tyres can put more force on the road without slipping.</p>

<h3>11.5 Range</h3>
<p style="text-align:center;font-size:1.15em"><span class="f">Range (km) = Usable battery energy (Wh) ÷ Consumption (Wh per km)</span></p>
<p>Consumption is the EV's "fuel average". A small city car may use 110–130 Wh/km; a compact SUV 150–180 Wh/km; a large SUV or pickup 200–280 Wh/km. An electric motorcycle uses only 25–40 Wh/km.</p>
<aside class="c ex"><h4>Worked example</h4>
<p>Usable battery 60 kWh = 60,000 Wh. Consumption 160 Wh/km.</p>
<p>Range = 60,000 ÷ 160 = <b>375 km</b></p>
<p>On the motorway at 120 km/h with A/C, consumption rises to 230 Wh/km: range = 60,000 ÷ 230 = <b>261 km</b>.</p></aside>
<figure>
<svg viewBox="0 0 720 230" role="img" aria-label="Bar chart: range falls as cruising speed rises">
<path d="M90 20 V180 H690" class="ln"/>
<g class="gb"><rect x="130" y="30" width="90" height="150"/><rect x="270" y="60" width="90" height="120"/><rect x="410" y="85" width="90" height="95"/><rect x="550" y="105" width="90" height="75"/></g>
<g class="m bd"><text x="175" y="52">500 km</text><text x="315" y="82">400 km</text><text x="455" y="107">316 km</text><text x="595" y="127">250 km</text></g>
<g class="m s"><text x="175" y="170">120 Wh/km</text><text x="315" y="170">150 Wh/km</text><text x="455" y="170">190 Wh/km</text><text x="595" y="170">240 Wh/km</text></g>
<g class="m bd"><text x="175" y="200">60 km/h</text><text x="315" y="200">80 km/h</text><text x="455" y="200">100 km/h</text><text x="595" y="200">120 km/h</text></g>
<text x="390" y="222" class="m s mu">Illustration for a compact electric SUV with 60 kWh usable, steady speed, mild weather</text>
<text x="40" y="100" class="s bd" transform="rotate(-90 40 100)" text-anchor="middle">Range</text>
</svg>
<figcaption><b>Figure 11.2</b> Speed is the biggest factor in range. Air resistance rises with the <em>square</em> of speed.</figcaption></figure>

<h4>What reduces range</h4>
<div class="tw"><table>
<thead><tr><th>Factor</th><th>Why</th><th>Typical effect</th></tr></thead>
<tbody>
<tr><td>High speed</td><td>Air drag rises with speed squared</td><td>Large: see Figure 11.2</td></tr>
<tr><td>Air-conditioning in extreme heat</td><td>Compressor uses 1–3 kW; also cools the battery</td><td>5–20%</td></tr>
<tr><td>Hard acceleration and braking</td><td>Regeneration recovers only part of the energy</td><td>10–20%</td></tr>
<tr><td>Weight and roof loads</td><td>More rolling resistance and drag</td><td>5–15%</td></tr>
<tr><td>Under-inflated or wrong tyres</td><td>More rolling resistance</td><td>3–10%</td></tr>
<tr><td>Battery age (lower SOH)</td><td>Less energy stored</td><td>Equal to the SOH loss</td></tr>
<tr><td>Dragging brakes, poor alignment</td><td>Wasted energy</td><td>Varies — and it is your job to find it</td></tr>
</tbody></table></div>

<h4>Brochure range and real range</h4>
<p>Range is measured on standard laboratory tests. Different tests give different answers for the same car:</p>
<ul>
<li><b>NEDC</b> and <b>CLTC</b> — older and Chinese tests. Gentle and optimistic. Often quoted in Pakistani advertising.</li>
<li><b>WLTP</b> — the current European test. More realistic.</li>
<li><b>Real mixed driving</b> in Pakistan is usually around <b>70–80% of the NEDC or CLTC figure</b>, and less on the motorway in summer.</li>
</ul>
<aside class="c tip"><h4>Workshop tip</h4><p>"My range has dropped" is one of the most common EV complaints. Before blaming the battery, check: tyre pressures, brake drag, wheel alignment, driving speed, A/C use, and the season. Then read the <b>SOH</b> on the scan tool. Most of the time the battery is fine and the cause is one of the simple things.</p></aside>

<h3>11.6 Efficiency and running cost</h3>
<p>From battery to wheels, an EV is about <b>85–90%</b> efficient. A petrol engine turns only about <b>25–35%</b> of the fuel's energy into motion; the rest is heat. This is the basic reason an EV costs less per kilometre.</p>
<aside class="c ex"><h4>Worked example — cost per 100 km (put in today's prices)</h4>
<p><b>EV:</b> 16 kWh per 100 km × Rs 50 per unit = <b>Rs 800</b><br>
<b>Petrol car:</b> 12 km per litre → 8.3 litres per 100 km × Rs 270 per litre = <b>Rs 2,240</b></p>
<p>With home solar, the EV figure can be far lower. Prices change, so always redo this sum with current rates.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Power (kW) = torque (Nm) × rpm ÷ 9,550.</li>
<li>Torque × gear ratio gives launch; power gives high-speed performance.</li>
<li>Performance is limited by the weakest of: battery power, inverter current, motor, tyres.</li>
<li>Battery power depends on size, chemistry, temperature, SOC and health.</li>
<li>Range = usable energy ÷ consumption. Speed, A/C, tyres and driving style change consumption.</li>
<li>Expect about 70–80% of NEDC/CLTC range in real use.</li></ul></aside>

<div class="quiz"><h3>Quiz 11</h3><p>Choose one answer for each question.</p><ol>
<li>A motor produces 200 Nm at 9,550 rpm. What is its power?<ul><li>20 kW</li><li>100 kW</li><li data-c>200 kW</li><li>955 kW</li></ul></li>
<li>A car has 50 kWh usable and uses 200 Wh/km. What is its range?<ul><li>100 km</li><li data-c>250 km</li><li>400 km</li><li>1,000 km</li></ul></li>
<li>A 150 kW motor is fitted to a car whose battery can supply only 80 kW. What is the maximum drive power?<ul><li>150 kW</li><li>230 kW</li><li data-c>80 kW</li><li>70 kW</li></ul></li>
<li>Why does a cold or aged battery reduce the car's power?<ul><li>The motor shrinks</li><li data-c>Higher internal resistance makes the BMS lower the current limit</li><li>The tyres lose grip</li><li>The gear ratio changes</li></ul></li>
<li>Which factor usually has the biggest effect on motorway range?<ul><li>Radio volume</li><li>Headlights</li><li data-c>Speed</li><li>Colour of the car</li></ul></li>
<li>A car is advertised with 500 km NEDC range. What real mixed-driving range is realistic?<ul><li>600 km</li><li>500 km</li><li data-c>About 350–400 km</li><li>100 km</li></ul></li>
<li>A customer says range has dropped. What should you check before suspecting the battery?<ul><li>Nothing — replace the battery</li><li data-c>Tyre pressures, brake drag, alignment and driving conditions, then SOH</li><li>The paint</li><li>The wiper motor</li></ul></li>
</ol></div>
</section></template>
<template data-m="12" data-part="Part D · The electric drive" data-title="Transmission, regenerative braking and chassis"><section class="mod">
<div class="mh"><div class="n">12</div><div><div class="pt">Part D · The electric drive</div><h2>Transmission, regenerative braking and chassis</h2><p>The mechanical side of an EV: one gear, two kinds of braking, and a heavy car on four tyres.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>Why EVs have a single-speed reduction gear</li>
<li>How regenerative braking works and when it is limited</li>
<li>How regenerative and friction brakes are blended</li>
<li>Brake, tyre and lifting points specific to EVs</li></ul></div>

<h3>12.1 The reduction gear</h3>
<p>A petrol engine works well only in a narrow speed band, so it needs 5 or more gears. An electric motor gives useful torque from 0 to over 16,000 rpm, so <b>one fixed gear ratio</b> is enough. A typical ratio is between <b>8:1 and 12:1</b>: the motor turns about ten times for each turn of the wheels.</p>
<figure>
<svg viewBox="0 0 720 300" role="img" aria-label="Two-stage reduction gear with differential">
<rect x="80" y="36" width="150" height="70" rx="8" class="gb"/><text x="155" y="68" class="m bd">Motor</text><text x="155" y="86" class="m s">up to 16,000 rpm</text>
<path d="M230 71 H330" class="mc"/>
<rect x="300" y="52" width="20" height="38" class="yb"/>
<rect x="300" y="90" width="20" height="110" class="kb"/>
<path d="M280 145 H400" class="mc"/>
<rect x="364" y="126" width="20" height="38" class="yb"/>
<rect x="364" y="164" width="20" height="120" class="kb"/>
<rect x="340" y="204" width="68" height="40" rx="6" class="rb"/><text x="374" y="229" class="m s bd">Diff</text>
<path d="M340 224 H90 M408 224 H640" class="mc"/>
<rect x="56" y="186" width="34" height="76" rx="8" class="db"/><rect x="640" y="186" width="34" height="76" rx="8" class="db"/>
<g class="s"><text x="420" y="64" class="bd">Input gear (small)</text><path d="M416 60 H324" class="ln"/>
<text x="420" y="110" class="bd">Stage 1 — about 3 : 1</text><path d="M416 106 H324" class="ln"/>
<text x="470" y="150" class="bd">Intermediate shaft</text><path d="M466 146 H404" class="ln"/>

</svg>
<figcaption><b>Figure 12.1</b> A typical two-stage reduction gear with differential, shown schematically.</figcaption></figure>
<ul>
<li><b>Reverse</b> is done by spinning the motor backwards. There is no reverse gear.</li>
<li><b>Park</b> uses a locking pawl in the gear unit, usually moved by a small electric actuator, plus the electric parking brake.</li>
<li><b>Neutral</b> simply means the inverter sends no current.</li>
<li>The unit has its own <b>gear oil</b> (the specific fluid named by the maker). Some are "filled for life"; many specify a change at set intervals. Follow the service schedule.</li>
</ul>
<p>Hybrids are different: they have special transmissions that mix engine and motor power. See Module 13.</p>

<h3>12.2 Regenerative braking</h3>
<p>When the driver lifts off the accelerator or presses the brake, the inverter makes the motor work as a <b>generator</b>. The wheels drive the motor; the motor resists; the car slows; and electricity flows back into the battery. Energy that a normal car throws away as brake heat is recovered.</p>
<aside class="c pic"><h4>Picture it — the bicycle dynamo</h4><p>Switch on a bicycle's dynamo lamp and pedalling becomes harder. The dynamo is taking energy from your legs and turning it into electricity. Regenerative braking is the same thing on purpose: the motor becomes the dynamo, the "harder to pedal" feeling is what slows the car, and the electricity goes back into the battery instead of a lamp.</p></aside>
<ul>
<li>In city driving, regeneration can recover roughly 15–25% of the energy used.</li>
<li>Most cars let the driver choose the strength (low / standard / high). Strong regeneration allows <b>one-pedal driving</b>.</li>
<li>Brake lights come on automatically when regeneration is slowing the car firmly.</li>
</ul>
<h4>When regeneration is reduced or switched off</h4>
<div class="tw"><table>
<thead><tr><th>Situation</th><th>Reason</th></tr></thead>
<tbody>
<tr><td>Battery at or near 100%</td><td>There is nowhere to put the energy</td></tr>
<tr><td>Battery very cold or very hot</td><td>Cells cannot accept high charge current safely</td></tr>
<tr><td>Very low speed (below about 5–10 km/h)</td><td>The motor generates too little</td></tr>
<tr><td>Emergency stop or ABS/ESC active</td><td>Friction brakes give faster, more controllable braking at each wheel</td></tr>
<tr><td>Fault in the HV system</td><td>Regeneration disabled for safety</td></tr>
</tbody></table></div>
<aside class="c tip"><h4>Workshop tip</h4><p>A customer who charges to 100% at the top of a hill station and then drives down will find the car "does not slow like before". That is normal: a full battery cannot take regeneration, so the friction brakes do all the work. Explain it; do not go looking for a fault.</p></aside>

<h3>12.3 Brake blending</h3>
<p>Every EV and hybrid still has normal hydraulic <b>friction brakes</b> with discs and pads. The car's brake computer decides, moment by moment, how much braking comes from the motor and how much from the pads. The driver should feel one smooth pedal.</p>
<figure>
<svg viewBox="0 0 720 220" role="img" aria-label="Brake blending: regenerative braking does most of the work until low speed, then friction brakes take over">
<path d="M80 20 V170 H680" class="ln"/>
<path d="M80 170 V60 H520 L620 170z" fill="#B2E0C0" stroke="#2B8A3E" stroke-width="2"/>
<path d="M520 60 H650 V170 H620z" fill="#FFC9C9" stroke="#C92A2A" stroke-width="2"/>
<text x="300" y="120" class="m l bd">Regenerative braking</text><text x="300" y="140" class="m s">energy returned to the battery</text>
<text x="650" y="34" class="e s bd r">Friction brakes</text><text x="650" y="48" class="e s r">take over as the car stops</text>
<text x="80" y="190" class="s bd">100 km/h</text><text x="650" y="190" class="e s bd">0 km/h</text><text x="365" y="208" class="m s mu">Car slowing down at a steady, moderate rate →</text>
<text x="40" y="100" class="s bd" transform="rotate(-90 40 100)" text-anchor="middle">Braking force</text>
</svg>
<figcaption><b>Figure 12.2</b> Blending during a normal, gentle stop. In a hard stop, friction brakes are added on top from the start.</figcaption></figure>
<p>To make blending possible, and because there is no engine vacuum for a normal brake servo, EVs use an <b>electric brake booster</b> or a full <b>brake-by-wire</b> unit. The pedal is connected to a sensor and a "pedal feel simulator"; an electric motor or pump creates the hydraulic pressure.</p>

<h3>12.4 Brake service on EVs</h3>
<p>Because the motor does most of the braking, pads and discs last a very long time. The problem is the opposite of wear: <b>lack of use</b>.</p>
<ul>
<li>Discs rust, especially at the rear, and after the monsoon.</li>
<li>Caliper slide pins seize; pads stick in their carriers; brakes drag and waste range.</li>
<li><b>Service:</b> at least once a year, remove the pads, clean and lubricate the slide pins and pad contact points, and check the discs.</li>
<li><b>Brake fluid</b> still absorbs moisture. Change it every 2 years or as specified.</li>
<li>Electric parking brakes need the scan tool's <b>service mode</b> to wind back the rear calipers before changing pads.</li>
<li>Bleeding a brake-by-wire system often needs a scan-tool procedure.</li>
</ul>

<h3>12.5 Tyres, suspension and lifting</h3>
<ul>
<li>EVs are <b>300–500 kg heavier</b> than similar petrol cars and have instant torque. Tyres wear faster. Fit tyres with the correct <b>load index</b>; many are marked for EV use (lower rolling resistance, lower noise).</li>
<li>Rotate tyres regularly and check alignment. Poor alignment costs range as well as rubber.</li>
<li>Suspension bushes, ball joints and dampers carry more weight; on rough roads they wear sooner.</li>
</ul>
<aside class="c danger"><h4>Danger — lifting and jacking</h4><ul>
<li><b>Never place a jack or lift pad under the battery pack.</b> You can crush cells and cause an internal short. Use only the lifting points shown in the manual, usually on the sills.</li>
<li>Watch for speed breakers and stones: check the battery under-tray for dents and scrapes at every service.</li>
<li>Removing a battery pack (300–600 kg) needs a proper battery lifting table. It also changes the car's balance on the lift.</li>
<li>Most EVs must be transported on a flatbed, not towed with driven wheels on the ground.</li></ul></aside>
<aside class="c pk"><h4>In Pakistan</h4><p>High speed breakers, broken roads and flooded underpasses are a real threat to under-floor batteries. An under-body inspection — looking for dents, torn covers, damaged coolant pipes and water marks — is a valuable service you can offer at every visit.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>One fixed reduction gear of about 10:1; reverse by spinning the motor backwards.</li>
<li>Regenerative braking turns motion back into battery energy.</li>
<li>Regeneration is limited when the battery is full, cold or hot, at very low speed, and in emergency stops.</li>
<li>Friction brakes last long but seize from lack of use: clean and lubricate yearly; change fluid every 2 years.</li>
<li>EVs are heavy: correct tyres, correct lifting points, never jack under the battery.</li></ul></aside>

<div class="quiz"><h3>Quiz 12</h3><p>Choose one answer for each question.</p><ol>
<li>Why does an EV need only one gear?<ul><li>Gears are too expensive</li><li data-c>The motor gives useful torque over a very wide speed range, from 0 rpm</li><li>EVs are slow</li><li>The battery cannot power a gearbox</li></ul></li>
<li>How does an EV reverse?<ul><li>A reverse gear is engaged</li><li>The wheels are disconnected</li><li data-c>The motor spins in the opposite direction</li><li>The battery polarity is swapped</li></ul></li>
<li>When is regenerative braking reduced?<ul><li>When the battery is at 50%</li><li data-c>When the battery is fully charged</li><li>When the A/C is on</li><li>When the headlights are on</li></ul></li>
<li>What is the most common brake problem on EVs?<ul><li>Pads wearing out very fast</li><li data-c>Rust and seized sliders from lack of use</li><li>Boiling brake fluid</li><li>Broken brake pedal</li></ul></li>
<li>Where must you never place a jack?<ul><li>Under the sill lifting points</li><li>Under the subframe point shown in the manual</li><li data-c>Under the battery pack</li><li>On a level floor</li></ul></li>
<li>Why do EVs use an electric brake booster?<ul><li>To charge the battery</li><li data-c>There is no engine vacuum, and it allows blending with regenerative braking</li><li>To make the pedal harder</li><li>To cool the brakes</li></ul></li>
</ol></div>
</section></template>
<template data-m="13" data-part="Part E · Hybrids" data-title="Hybrid systems in detail"><section class="mod">
<div class="mh"><div class="n">13</div><div><div class="pt">Part E · Hybrids</div><h2>Hybrid systems in detail</h2><p>Toyota, Honda, Hyundai/Kia and the Chinese plug-in systems: same goal, different engineering.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>How a hybrid saves fuel</li>
<li>How the Toyota power-split system works</li>
<li>How Honda, Hyundai/Kia and Chinese DHT plug-in hybrids differ</li>
<li>Typical hybrid faults and service points</li></ul></div>

<h3>13.1 How a hybrid saves fuel</h3>
<ol>
<li><b>Engine off when not needed</b> — at traffic lights, in slow traffic, when coasting.</li>
<li><b>Electric drive at low speed</b>, where a petrol engine is least efficient.</li>
<li><b>Regenerative braking</b> — recovering energy that brakes would waste.</li>
<li><b>Engine kept at its most efficient load.</b> If the engine makes more power than needed, the extra charges the battery; if it makes less, the motor adds the rest.</li>
<li><b>Efficient engine design.</b> Hybrid engines usually use the <em>Atkinson cycle</em> (late-closing intake valves): less power but better economy. The motor covers the missing power.</li>
</ol>
<p>These gains are biggest in stop-start city traffic — exactly the conditions of Karachi, Lahore and Rawalpindi.</p>

<h3>13.2 Toyota Hybrid System (power split)</h3>
<p>Used in the Prius, Aqua, Yaris, Corolla Cross, Camry and Lexus hybrids. There is no clutch, no stepped gearbox, no starter motor and no alternator. One <b>planetary gear set</b> joins three things:</p>
<figure>
<svg viewBox="0 0 720 290" role="img" aria-label="Toyota power split planetary gear: sun gear to generator, carrier to engine, ring gear to motor and wheels">
<circle cx="170" cy="145" r="104" fill="#D7EFEC" stroke="#0B6E69" stroke-width="2"/><circle cx="170" cy="145" r="90" fill="#fff" stroke="#0B6E69" stroke-width="2"/>
<path d="M170 85 L230 145 L170 205 L110 145z" fill="none" stroke="#5A6B76" stroke-width="7" stroke-linejoin="round"/>
<g class="kb"><circle cx="230" cy="145" r="29"/><circle cx="110" cy="145" r="29"/><circle cx="170" cy="85" r="29"/><circle cx="170" cy="205" r="29"/></g>
<circle cx="170" cy="145" r="30" class="hb"/><text x="170" y="150" class="m s bd">Sun</text>
<g class="s"><path d="M196 152 L390 232" class="ln"/><text x="396" y="228" class="bd o">Sun gear → MG1 (generator)</text><text x="396" y="244">Starts the engine. Generates electricity.</text><text x="396" y="258">Its speed controls the "gear ratio".</text>
<path d="M214 100 L390 130" class="ln"/><text x="396" y="126" class="bd">Planet carrier → ENGINE</text><text x="396" y="142">Engine power enters here and is split two ways:</text><text x="396" y="156">part to the wheels, part to MG1.</text>
<path d="M250 78 L390 40" class="ln"/><text x="396" y="36" class="bd g">Ring gear → MG2 (drive motor) → WHEELS</text><text x="396" y="52">MG2 drives the car and does the regenerative braking.</text><text x="396" y="66">Turns whenever the wheels turn.</text></g>
<text x="170" y="278" class="m s mu">Four planet gears on a carrier, between sun and ring</text>
</svg>
<figcaption><b>Figure 13.1</b> The power-split device. Because the electronics control MG1's speed, the engine can run at any speed for any road speed — an "electronic CVT" (e-CVT) with no belts.</figcaption></figure>
<div class="tw"><table>
<thead><tr><th>Driving situation</th><th>What happens</th></tr></thead>
<tbody>
<tr><td>Pulling away gently</td><td>Engine off. Battery → MG2 → wheels.</td></tr>
<tr><td>Normal acceleration</td><td>MG1 spins the engine to start it. Engine power splits: part to wheels, part through MG1 → MG2.</td></tr>
<tr><td>Hard acceleration</td><td>Engine plus battery power through MG2.</td></tr>
<tr><td>Cruising</td><td>Mostly engine; surplus charges the battery.</td></tr>
<tr><td>Braking</td><td>MG2 generates and charges the battery. Engine off.</td></tr>
</tbody></table></div>
<p><b>Battery:</b> NiMH or lithium-ion, about 1–1.5 kWh. Aqua: 144 V (120 cells × 1.2 V). Prius (third generation): 201.6 V (168 cells). A boost converter raises this to as much as 650 V for the motors. The battery is air-cooled by a fan drawing cabin air.</p>

<h3>13.3 Honda e:HEV (two-motor system)</h3>
<p>Used in the HR-V e:HEV and other recent Honda hybrids. It has a generator motor, a drive motor, and a single clutch.</p>
<ul>
<li><b>City driving — series mode.</b> The engine turns the generator; the drive motor turns the wheels. Engine speed is not tied to road speed.</li>
<li><b>Steady cruising — engine drive.</b> A clutch connects the engine straight to the wheels through one fixed gear, like top gear.</li>
<li><b>Low load — EV mode.</b> Battery → drive motor.</li>
</ul>
<aside class="c tip"><h4>Workshop tip — do not confuse the two Honda systems</h4><p>Older imported Honda <b>Vezel and Fit hybrids</b> (2013–2020) use a different system called <b>i-DCD</b>: one motor inside a 7-speed dual-clutch gearbox. These are known for clutch judder and gearbox actuator faults. The newer <b>e:HEV</b> has no such gearbox. Always identify which system you have before diagnosing.</p></aside>

<h3>13.4 Hyundai / Kia parallel hybrid</h3>
<p>Used in the Tucson, Santa Fe and Sportage hybrids. The layout looks familiar to any mechanic:</p>
<p style="text-align:center"><b>Turbo petrol engine → engine clutch → electric motor → 6-speed automatic gearbox → wheels</b></p>
<ul>
<li>The motor (about 44 kW) sits where the torque converter would be.</li>
<li>With the clutch open, the motor alone drives through the gearbox (EV mode). With it closed, engine and motor work together.</li>
<li>A second small motor, the <b>HSG</b> (hybrid starter-generator), is belt-driven on the engine to start it smoothly and to generate.</li>
<li>Battery: lithium-ion polymer, about 1.5 kWh, 270 V.</li>
</ul>

<h3>13.5 Chinese plug-in hybrids (DHT systems)</h3>
<p>BYD (<b>DM-i</b>), GWM Haval (<b>Hi4 / DHT</b>), and Chery / Jaecoo (<b>CSH / SHS</b>) all use a <b>dedicated hybrid transmission (DHT)</b>: a compact unit containing a generator, a drive motor, a clutch, and one to three gears for the engine. They behave mainly like an electric car, with the engine helping when needed.</p>

<h3>13.6 What is extra on a plug-in hybrid</h3>
<ul>
<li>A much bigger battery, on-board charger and charge port — everything from the EV modules applies.</li>
<li><b>Driver modes:</b> EV (electric first), HEV (automatic), and often "save" or "charge" (use the engine to hold or raise the battery level).</li>
<li><b>Engine that rarely runs.</b> If the owner drives mostly on electricity, petrol can sit in the tank for months and go stale; oil can collect moisture because the engine never fully warms up. Many PHEVs force the engine to run occasionally for this reason. Oil changes are still needed by <em>time</em>, even if the engine hours are low.</li>
<li><b>Sealed, pressurised fuel tank</b> on many PHEVs: the fuel flap must be released by a button and may take a few seconds.</li>
</ul>

<h3>13.7 Hybrid faults and service</h3>
<p>A hybrid needs <b>all the service of a petrol car</b> (oil, filters, plugs, coolant) <b>plus</b> care of the high-voltage system.</p>
<div class="tw"><table>
<caption>Table 13.2 — Common faults on hybrids</caption>
<thead><tr><th>Fault</th><th>Symptoms</th><th>Notes</th></tr></thead>
<tbody>
<tr><td>HV battery worn (older Toyota, Honda)</td><td>Warning triangle, fault code P0A80, engine runs constantly, poor fuel economy, charge gauge swings rapidly up and down</td><td>Use scan tool to compare block voltages. One or more weak modules.</td></tr>
<tr><td>Blocked battery cooling fan</td><td>Battery overheats; fan noisy; early battery failure</td><td>Clean fan and ducts at every service</td></tr>
<tr><td>Inverter coolant pump failure</td><td>Overheat warning, power cut</td><td>Check flow in reservoir</td></tr>
<tr><td>Weak 12 V battery</td><td>Will not go to READY; strange warning lights</td><td>The most common "hybrid fault" of all</td></tr>
<tr><td>Brake actuator / accumulator</td><td>Brake warning, buzzing pump, hard pedal</td><td>Safety-critical; follow manual</td></tr>
<tr><td>Engine issues from stop-start use</td><td>Rough running at start, blocked EGR, oil sludge</td><td>Engine runs cold more often</td></tr>
<tr><td>Dual-clutch gearbox (Honda i-DCD)</td><td>Judder, no drive, gearbox warning</td><td>Clutch and actuator learning via scan tool</td></tr>
</tbody></table></div>
<aside class="c pk"><h4>In Pakistan — hybrid battery "repair"</h4><p>Many shops replace one or two weak modules in an old Aqua or Prius battery. It is cheap and gets the car moving. But the remaining modules are just as old, and new modules that do not match the old ones go out of balance quickly, so the fault often returns within months. A good technician tests <b>all</b> modules, matches replacements by capacity, cleans the bus bars and fan, and is <b>honest with the customer</b> about how long the repair may last compared with a new or fully reconditioned pack.</p></aside>
<aside class="c danger"><h4>Danger</h4><p>A hybrid in READY mode is silent but <b>on</b>. The engine can start at any moment without warning. Before working in the engine bay, switch fully off and keep the key away. And remember: a "small" hybrid battery at 144–270 V is every bit as deadly as a big EV pack.</p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>Hybrids save fuel by stopping the engine, driving electrically at low speed, regenerating, and running the engine efficiently.</li>
<li>Toyota: planetary power split, two motor-generators, e-CVT.</li>
<li>Honda e:HEV: mostly series, with a direct-drive clutch for cruising. Older Vezel/Fit i-DCD is different.</li>
<li>Hyundai/Kia: parallel, motor between engine and 6-speed automatic.</li>
<li>Chinese PHEVs: DHT with EV, series and parallel modes, 18–30 kWh batteries.</li>
<li>Hybrids need petrol-car servicing plus HV care. Check the 12 V battery first.</li></ul></aside>

<div class="quiz"><h3>Quiz 13</h3><p>Choose one answer for each question.</p><ol>
<li>In the Toyota power-split device, what is connected to the planet carrier?<ul><li>MG1</li><li>MG2</li><li data-c>The engine</li><li>The battery</li></ul></li>
<li>Which component starts the engine in a Toyota hybrid?<ul><li>A normal 12 V starter motor</li><li data-c>MG1</li><li>The driver's foot</li><li>The DC-DC converter</li></ul></li>
<li>In series mode on a DHT plug-in hybrid, what drives the wheels?<ul><li>The engine through the clutch</li><li data-c>The drive motor only</li><li>The generator</li><li>The 12 V battery</li></ul></li>
<li>Which layout do Hyundai and Kia hybrids use?<ul><li>Series only</li><li>Power split</li><li data-c>Parallel, with the motor between engine and automatic gearbox</li><li>Hub motors</li></ul></li>
<li>A hybrid will not go to READY and shows many warning lights. What do you check first?<ul><li>HV battery modules</li><li>Inverter</li><li data-c>The 12 V battery</li><li>The planetary gear</li></ul></li>
<li>Why do PHEV engines still need oil changes by time, even with few engine hours?<ul><li>The oil evaporates</li><li data-c>Short, cold engine runs let moisture and fuel collect in the oil</li><li>The battery heats the oil</li><li>They do not need oil changes</li></ul></li>
<li>Why is a hybrid in READY mode dangerous to work on?<ul><li>The radio may come on</li><li data-c>The engine can start by itself without warning</li><li>The tyres may deflate</li><li>It uses more fuel</li></ul></li>
</ol></div>
</section></template>

<aside class="c pk"><h4>In Pakistan</h4><p>NEPRA's rules for public charging specify Type 2 for AC and CCS2 for DC. Many public DC stations also carry a GB/T gun because so many cars come from China. Before advising a customer on a home charger, <b>look at the car's inlet</b>. Cheap, unbranded GB/T-to-CCS2 or Type 2 adapters are a common cause of overheated, melted charge ports.</p></aside>

<p>Training in China is done on GB/T equipment, and cars imported directly from China have GB/T inlets, so you must know these as well.</p>

<h3>14.3 How the car and charger talk</h3>
<aside class="c pic"><h4>Picture it — knocking on the door</h4><p>A polite visitor knocks, waits to hear "who is it?", answers, and only walks in when invited. A charger does the same. It "knocks" with a small signal, the car answers, they agree how much current is allowed, the plug locks — and only then does the power come on. Pull the plug and the conversation ends instantly, so the pins are never live in your hand.</p></aside>
<p>No power flows the moment you plug in. First there is a <b>handshake</b> on the control pilot (CP) wire:</p>
<ol>
<li>Charger puts +12 V on CP. Not connected.</li>
<li>Plug in: a resistor in the car pulls CP down to <b>9 V</b>. Charger knows a car is present and starts a 1 kHz signal whose pulse width says "you may take up to X amps".</li>
<li>Car is ready: it pulls CP down to <b>6 V</b>. The plug is locked.</li>
<li>Only now does the charger close its relay and switch on the power.</li>
<li>If anything is wrong — earth missing, plug pulled, fault — CP changes and the power is cut in milliseconds.</li>
</ol>
<p>For <b>DC charging</b> the car's BMS and the station exchange digital messages continuously: battery voltage, maximum current, temperature. <b>The BMS is in charge</b>; the station supplies exactly the voltage and current the BMS requests.</p>

<h4>Measuring the charging signals</h4>
<p>When a car will not charge, measuring these low-voltage signals at the inlet tells you whether car and charger are "talking". They are safe, low-voltage tests.</p>
<div class="tw"><table>
<thead><tr><th>Signal</th><th>What to expect</th></tr></thead>
<tbody>
<tr><td><b>CP</b> to PE (AC charging, Type 2 and GB/T)</td><td>+12 V with nothing connected → 9 V when plugged in → 6 V when the car is ready. During charging it is a 1 kHz square wave; the wider the pulse, the more current is allowed.</td></tr>
<tr><td><b>PP</b> (Type 2) or <b>CC</b> (GB/T AC) to PE</td><td>A fixed resistor in the plug that tells the car the cable's rating. Roughly: 1.5 kΩ = light-duty cable, 680 Ω = 16–20 A, 220 Ω = 32 A, 100 Ω = 63 A.</td></tr>
<tr><td><b>CC1</b> (GB/T DC)</td><td>The station watches this point: about 12 V unplugged, 6 V while the latch button is pressed, 4 V when fully connected.</td></tr>
<tr><td><b>S+ / S−</b> (GB/T DC)</td><td>A CAN bus: about 60 Ω between them with power off; messages visible with a CAN tool.</td></tr>
</tbody></table></div>

<h3>14.4 The charging curve</h3>
<figure>
<svg viewBox="0 0 720 240" role="img" aria-label="DC fast charging power against state of charge">
<rect x="140" y="20" width="420" height="170" fill="#E9F7EC"/>
<path d="M80 20 V190 H690" class="ln"/>
<path d="M80 150 L104 50 H410 L560 112 L620 162 L680 176" class="hv" style="stroke-width:3.5"/>
<g class="m s"><text x="80" y="208">0%</text><text x="140" y="208">10%</text><text x="380" y="208">50%</text><text x="560" y="208">80%</text><text x="680" y="208">100%</text></g>
<text x="380" y="230" class="m s bd">State of charge</text><text x="40" y="105" class="s bd" transform="rotate(-90 40 105)" text-anchor="middle">Charging power</text>
<text x="260" y="42" class="m s bd o">Peak power</text><text x="520" y="84" class="s bd o">Taper begins</text><text x="640" y="150" class="m s bd o">Very slow</text>
<text x="350" y="140" class="m bd g">Fast-charge window: 10% to 80%</text>
</svg>
<figcaption><b>Figure 14.4</b> A typical DC charging curve. Above about 80% the BMS reduces current to protect the cells.</figcaption></figure>
<p>Like filling a glass of water, you pour fast at first and slow down near the top. Charging from 80% to 100% can take as long as 10% to 80%. Heat and cold also slow charging: a battery at 45 °C or 5 °C will be limited by the BMS.</p>
<aside class="c ex"><h4>Worked example — charging time</h4>
<p><span class="f">Time (h) ≈ Energy needed (kWh) ÷ Charger power (kW)</span>, plus about 10% for losses.</p>
<p>A 60 kWh battery from 20% to 80% needs 60% × 60 = 36 kWh.<br>
On a 7 kW wallbox: 36 ÷ 7 × 1.1 ≈ <b>5.7 hours</b>.<br>
On a 60 kW DC charger: 36 ÷ 60 × 1.1 ≈ <b>40 minutes</b>.</p></aside>

<h3>14.5 Home charging in Pakistan</h3>
<p>An EV wallbox is the biggest continuous electrical load most houses will ever have: <b>32 A for many hours</b>. Wiring that copes with an air-conditioner cycling on and off may overheat under this.</p>
<div class="tw"><table>
<caption>Table 14.3 — Requirements for a 7 kW (32 A) home charger</caption>
<thead><tr><th>Item</th><th>Requirement</th></tr></thead>
<tbody>
<tr><td><b>Sanctioned load</b></td><td>The house connection must support the extra 7 kW. Many single-phase connections do not; a load extension or three-phase meter may be needed.</td></tr>
<tr><td><b>Dedicated circuit</b></td><td>Its own cable direct from the distribution board. Nothing else on it.</td></tr>
<tr><td><b>Cable</b></td><td>Copper, at least 6 mm²; 10 mm² for long runs. Good-quality branded cable.</td></tr>
<tr><td><b>Breaker</b></td><td>40 A MCB for a 32 A charger</td></tr>
<tr><td><b>Earth-leakage protection</b></td><td>RCD (Type A with 6 mA DC detection in the charger, or Type B)</td></tr>
<tr><td><b>Earthing</b></td><td>A real, tested earth connection. <b>Essential.</b></td></tr>
<tr><td><b>Location</b></td><td>Protected from rain and direct sun; cable not lying in water</td></tr>
</tbody></table></div>
<aside class="c danger"><h4>Danger — earthing</h4><p>Many Pakistani houses have a poor earth or none at all. A proper EV charger checks the earth and <b>refuses to charge</b> without it. Never bypass this check, and never fit a "no-earth" cheat adapter. Without earth, a fault can make the whole car body live. Fix the earth instead.</p></aside>
<ul>
<li><b>3-pin sockets:</b> a portable charger draws 8–13 A for hours. Worn sockets and thin extension leads overheat and burn. Use a good 16 A socket on its own circuit; never a multi-plug extension.</li>
<li><b>Voltage swings and load-shedding:</b> chargers pause when voltage is too low or too high and restart when power returns. Frequent trips point to supply problems, not always the car.</li>
<li><b>Solar:</b> charging in daylight from rooftop solar is the cheapest energy available. Some wallboxes can follow the solar output.</li>
<li><b>UPS and small generators:</b> a domestic UPS cannot charge a car. Generators often have poor earthing and unstable voltage; most chargers will reject them.</li>
</ul>

<h3>14.6 Charging faults</h3>
<div class="tw"><table>
<thead><tr><th>Complaint</th><th>Check, in this order</th></tr></thead>
<tbody>
<tr><td>Will not start charging</td><td>Charging timer or schedule set in the car? Plug fully in and locked? Try another charger and cable. Earth at the socket. Charger error light. Fault codes.</td></tr>
<tr><td>Charges slowly on AC</td><td>Current limit set in car or on portable charger. Single-phase supply. Car's on-board charger rating. Hot battery.</td></tr>
<tr><td>Charging stops by itself</td><td>Supply voltage dips. Overheating plug or socket (look for brown marks). Battery over-temperature. Charge limit reached.</td></tr>
<tr><td>AC works, DC does not (or the reverse)</td><td>AC only → DC contactors or communication. DC only → on-board charger.</td></tr>
<tr><td>Plug stuck in the car</td><td>Unlock the car; use the manual release cable (location in the handbook).</td></tr>
<tr><td>Burnt or melted pins</td><td>Poor contact, cheap adapter, water or dirt. Replace the inlet <b>and</b> the cable; a damaged plug will destroy a new inlet.</td></tr>
</tbody></table></div>

<aside class="c sum"><h4>Summary</h4><ul>
<li>AC charging: conversion in the car's on-board charger, 2–22 kW. DC charging: conversion in the station, 30–350 kW.</li>
<li>Pakistan standard: Type 2 (AC) and CCS2 (DC). Grey imports from China use GB/T.</li>
<li>No power flows until the CP handshake is complete. In DC charging the BMS controls the station.</li>
<li>Fast-charge from 10% to 80%; it slows sharply after that.</li>
<li>Home charging needs a dedicated circuit, correct cable and breaker, RCD and a real earth.</li></ul></aside>

<div class="quiz"><h3>Quiz 14</h3><p>Choose one answer for each question.</p><ol>
<li>During AC charging, where is AC converted to DC?<ul><li>In the wallbox</li><li data-c>In the car's on-board charger</li><li>In the cable</li><li>In the motor</li></ul></li>
<li>Which DC fast-charging connector is the official standard in Pakistan?<ul><li>CHAdeMO</li><li>Type 1</li><li data-c>CCS2</li><li>3-pin plug</li></ul></li>
<li>A car with a 7 kW on-board charger is plugged into a 22 kW AC wallbox. How fast does it charge?<ul><li>22 kW</li><li>15 kW</li><li data-c>7 kW</li><li>29 kW</li></ul></li>
<li>How long does a 7 kW charger take to add 35 kWh (ignoring losses)?<ul><li>2 hours</li><li data-c>5 hours</li><li>7 hours</li><li>35 hours</li></ul></li>
<li>Why does DC charging slow down above about 80%?<ul><li>The station runs out of power</li><li>The cable gets too long</li><li data-c>The BMS reduces current to protect the cells as they near full</li><li>The motor needs to cool</li></ul></li>
<li>A home charger refuses to charge and shows an earth fault. What is the correct action?<ul><li>Use an adapter that bypasses the earth check</li><li data-c>Have the house earthing tested and repaired</li><li>Use a thinner cable</li><li>Charge from a UPS instead</li></ul></li>
<li>What does the control pilot (CP) wire do?<ul><li>Carries the main charging current</li><li>Earths the car body</li><li data-c>Lets car and charger confirm connection and agree the maximum current</li><li>Locks the steering</li></ul></li>
</ol></div>

<div class="mh"><div class="n">15</div><div><div class="pt">Part F · Supporting systems</div><h2>Cooling, heating and air-conditioning</h2><p>Thermal management and A/C in detail: one of the most common sources of EV workshop jobs.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>The three things an EV must keep at the right temperature</li>
<li>How the refrigeration cycle makes cold, stage by stage</li>
<li>How the electric compressor works and what it needs before it will run</li>
<li>How to read system pressures and what each pattern means</li>
<li>The correct way to recover, evacuate and charge refrigerant</li>
<li>How heat pumps and PTC heaters work</li>
<li>A step-by-step method for A/C faults</li></ul></div>

<h3>15.1 Why this module matters so much</h3>
<p>In a petrol car the A/C is a comfort item. In an EV it is part of the <b>drive system</b>, because the same A/C circuit usually cools the battery. That is why A/C work is among the most frequent jobs on electric cars:</p>
<ul>
<li>It runs far more hours: while driving, while parked with the cabin pre-cooled, and during fast charging.</li>
<li>The compressor contains high-voltage electronics that are damaged by moisture and wrong oil.</li>
<li>There are more valves, sensors and pipes than in a petrol car, so more places to leak or stick.</li>
<li>When it is weak, the customer notices twice: a warm cabin <em>and</em> slow charging or reduced power.</li>
</ul>
<div class="tw"><table>
<thead><tr><th>What must be kept at temperature</th><th>Ideal range</th><th>If too hot</th></tr></thead>
<tbody>
<tr><td>Battery</td><td>15–35 °C</td><td>Faster ageing, reduced power, slow charging, safety risk</td></tr>
<tr><td>Motor and power electronics</td><td>Coolant below about 65 °C</td><td>Power reduced; electronics fail</td></tr>
<tr><td>Cabin</td><td>Comfortable for people</td><td>Unhappy customer, and the A/C uses range</td></tr>
</tbody></table></div>

<h3>15.2 The loops</h3>
<figure>
<svg viewBox="0 0 720 280" role="img" aria-label="Three thermal loops: drive unit coolant, battery coolant and air-conditioning refrigerant, linked by the chiller">
<rect x="46" y="70" width="190" height="140" rx="10" class="lv" style="stroke-width:4"/>
<rect x="300" y="70" width="135" height="140" rx="10" class="gn" style="stroke-width:4"/>
<rect x="455" y="70" width="225" height="140" rx="10" class="rd" style="stroke-width:4"/>
<rect x="86" y="54" width="110" height="32" rx="6" class="lb"/><text x="141" y="75" class="m s bd">Radiator + fan</text>
<rect x="72" y="194" width="138" height="32" rx="6" class="gb"/><text x="141" y="215" class="m s bd">Motor + inverter</text>
<rect x="10" y="124" width="76" height="32" rx="6" class="yb"/><text x="48" y="145" class="m s bd">OBC, DC-DC</text>
<rect x="204" y="124" width="64" height="32" rx="6" class="kb"/><text x="236" y="145" class="m s bd">Pump</text>
<rect x="308" y="194" width="118" height="32" rx="6" class="hb"/><text x="367" y="215" class="m s bd">Battery pack</text>
<rect x="270" y="88" width="60" height="28" rx="6" class="kb"/><text x="300" y="107" class="m s bd">Pump</text>
<rect x="408" y="110" width="76" height="60" rx="6" class="rb"/><text x="446" y="136" class="m s bd">Chiller</text><text x="446" y="152" class="m s">heat swap</text>

<ul>
<li><b>Loop 1</b> cools the motor, inverter, charger and DC-DC converter through a radiator at the front.</li>
<li><b>Loop 2</b> circulates coolant through the battery's cold plate. In mild weather it may use a radiator; in hot weather it goes through the <b>chiller</b>.</li>
<li><b>Loop 3</b> is the air-conditioning. A second branch feeds the chiller (or, on direct-cooled packs such as BYD, plates inside the battery).</li>
</ul>
<p>Each coolant loop has its own <b>electric pump</b>. There is no engine-driven water pump and often no thermostat; instead there are electric <b>multi-way valves</b>.</p>

<h3>15.3 How A/C makes cold: the refrigeration cycle</h3>
<aside class="c pic"><h4>Picture it — sweat</h4><p>When sweat dries on your skin, you feel cool. The liquid takes heat from your body to turn into vapour. An A/C system does exactly this, on purpose and in a closed loop: a liquid <b>evaporates</b> inside the cabin unit and takes heat from the air, then is squeezed and <b>condensed</b> back to liquid outside, giving that heat away. A/C does not "make cold". It <b>carries heat</b> from inside to outside.</p></aside>

</svg>

<div class="tw"><table>
<caption>Table 15.1 — The four stages</caption>
<thead><tr><th>Stage</th><th>What happens</th><th>Refrigerant leaves as</th></tr></thead>
<tbody>
<tr><td><b>1 · Compression</b></td><td>The compressor sucks in cool gas and squeezes it. Squeezing a gas makes it hot (feel a bicycle pump).</td><td>Hot, high-pressure gas</td></tr>
<tr><td><b>2 · Condensation</b></td><td>In the condenser, outside air takes the heat away. The gas turns to liquid.</td><td>Warm, high-pressure liquid</td></tr>
<tr><td><b>3 · Expansion</b></td><td>The liquid is forced through a tiny opening. Pressure falls suddenly and it becomes very cold.</td><td>Cold, low-pressure mist</td></tr>
<tr><td><b>4 · Evaporation</b></td><td>In the evaporator, the cold mist boils to gas by taking heat from the cabin air. The air leaves cold and dry.</td><td>Cool, low-pressure gas</td></tr>
</tbody></table></div>
<aside class="c"><h4>Key idea — remember "C-C-E-E"</h4><p><b>C</b>ompress → <b>C</b>ondense → <b>E</b>xpand → <b>E</b>vaporate. Hot and high pressure from the compressor to the valve; cold and low pressure from the valve back to the compressor. If you can draw Figure 15.2 from memory, you can diagnose most A/C faults.</p></aside>

<h3>15.4 The parts and what goes wrong with each</h3>
<div class="tw"><table>
<caption>Table 15.2 — A/C components</caption>
<thead><tr><th>Part</th><th>Job</th><th>Typical faults</th></tr></thead>
<tbody>
<tr><td><b>Electric compressor</b></td><td>Pumps the refrigerant. Scroll type, with built-in motor and inverter.</td><td>Insulation fault, control board failure, seized scroll, noise</td></tr>
<tr><td><b>Condenser + fan</b></td><td>Gives heat to outside air</td><td>Blocked by dust, insects, plastic bags; stone damage and leaks; failed fan</td></tr>
<tr><td><b>Receiver-drier / desiccant</b></td><td>Stores liquid; a drying bag removes moisture</td><td>Saturated after the system has been open; must be renewed after major repairs</td></tr>
<tr><td><b>Expansion valve</b> (thermal TXV, or electronic EXV)</td><td>Meters refrigerant into the evaporator. EVs often have several EXVs: cabin, battery chiller, heat pump.</td><td>Blocked by debris or ice; EXV motor sticking</td></tr>
<tr><td><b>Evaporator + blower</b></td><td>Cools and dries cabin air</td><td>Leaks (hard to see), bad smell from mould, blocked water drain, blocked cabin filter</td></tr>
<tr><td><b>Chiller</b></td><td>Second "evaporator" that cools battery coolant</td><td>Internal leak; its EXV sticking</td></tr>
<tr><td><b>Pressure and temperature sensors</b></td><td>Tell the controller the system state</td><td>Wrong reading stops the compressor</td></tr>
<tr><td><b>Pipes, hoses, O-rings, service ports</b></td><td>Carry refrigerant</td><td>The most common leak points</td></tr>
</tbody></table></div>

<h3>15.5 The electric compressor</h3>
<p>Inside one sealed aluminium housing are three things:</p>
<ol>
<li><b>The scroll pump</b> — two spiral plates, one fixed and one moving in a small circle. Gas is trapped between the spirals and squeezed towards the centre. Smooth, quiet, few moving parts.</li>
<li><b>A three-phase motor</b> — a small version of the drive motor, cooled by the refrigerant flowing over it.</li>
<li><b>An inverter and control board</b> — a small version of the drive inverter, bolted to the housing.</li>
</ol>
<p>It has two electrical connections: an <b>orange high-voltage connector</b> (300–400 V DC, or more), and a <b>low-voltage connector</b> carrying 12 V, earth, and a <b>LIN or CAN</b> data line. The A/C controller does not switch the compressor on and off like a clutch; it sends a <b>speed command</b> (for example 800 to 8,000 rpm) and the compressor reports back its speed, current and any fault.</p>
<h4>What the compressor needs before it will run</h4>
<ul>
<li>A cooling request (cabin A/C on, or the battery asking for cooling)</li>
<li>High voltage present: car in READY or charging, pre-charge complete, HV fuse good</li>
<li>HVIL loop closed and no insulation fault</li>
<li>12 V supply, earth and LIN/CAN communication good</li>
<li>Refrigerant pressure inside limits (not empty, not too high)</li>
<li>Evaporator not near freezing; battery state of charge not too low</li>
</ul>
<p>If any one is missing, the compressor stays off. So "compressor not running" is usually a missing condition, not a dead compressor.</p>
<aside class="c danger"><h4>Danger — compressor oil</h4><p>In an electric compressor, the oil touches the motor windings. It must be a special <b>insulating oil</b> (POE type, such as ND-11 — check the label under the bonnet). Normal <b>PAG oil</b> from petrol-car systems conducts electricity. Even a small amount of PAG oil — from a shared A/C machine, hose or oil injector — can cause an <b>insulation fault</b> that stops the whole car, and can make the compressor casing live.</p><p>Use dedicated or properly flushed A/C equipment for EVs and hybrids, only the specified oil and refrigerant, and only leak-detection dye that is approved for electric compressors.</p></aside>

<h3>15.6 Pressures and what they tell you</h3>
<p>Pressure units: <span class="f">1 MPa = 10 bar ≈ 145 psi</span>. Chinese equipment and manuals use MPa; many gauges show bar and psi.</p>

<h3>15.7 Refrigerant service: recover, evacuate, charge</h3>
<div class="tw"><table>
<thead><tr><th>Refrigerant</th><th>Notes</th></tr></thead>
<tbody>
<tr><td><b>R134a</b></td><td>Common on existing cars. Not flammable. A strong greenhouse gas.</td></tr>
<tr><td><b>R1234yf</b></td><td>Newer cars. Mildly flammable. Different service ports and its own service machine.</td></tr>
</tbody></table></div>
<p>The type and the exact <b>charge weight in grams</b> are printed on a label under the bonnet. Never mix types. Never release refrigerant to the air: recover it with a machine.</p>
<ol class="steps">
<li><b>Recover.</b> The machine draws out the old refrigerant and measures how much came out. Compare with the label: a low amount confirms a leak.</li>
<li><b>Repair</b> the fault. Fit new O-rings with the correct oil. Renew the drier or desiccant if the system has been open for long or the compressor failed.</li>
<li><b>Evacuate.</b> Pull a deep vacuum for at least 30 minutes. This boils away moisture and removes air.</li>
<li><b>Vacuum hold test.</b> Close the valves and watch for 10–15 minutes. If the vacuum is lost, there is still a leak. Do not charge.</li>
<li><b>Charge by weight.</b> Put in exactly the amount on the label. EV systems are very sensitive: too little and too much both cause faults.</li>
<li><b>Verify.</b> Run the A/C: check pressures, vent temperature, compressor current and fault codes.</li>
</ol>
<h4>Finding leaks</h4>
<ul>
<li><b>Look first:</b> oily, dusty patches at pipe joints, the condenser and service ports.</li>
<li><b>Electronic leak detector:</b> a "sniffer" moved slowly under each joint (refrigerant is heavier than air).</li>
<li><b>Nitrogen pressure test:</b> fill the empty system with dry nitrogen, watch the gauge and use soapy water on joints. Good for larger leaks.</li>
<li><b>UV dye:</b> only a dye approved for electric compressors.</li>
</ul>
<aside class="c tip"><h4>Workshop tip</h4><p>"Just top it up" is poor practice on any car and worse on an EV. You cannot know how much is in the system without recovering and weighing it, and every top-up through a contaminated machine risks the compressor. Recover, fix the leak, evacuate, charge by weight.</p></aside>

<h3>15.8 Heating: heat pump and PTC</h3>
<p>There is no hot engine to warm the cabin, so EVs use one or both of these.</p>
<ul>
<li>A <b>PTC heater</b> — an electric heating element running on high voltage (3–6 kW). Simple, but it takes 1 kW of battery energy to make 1 kW of heat.</li>
<li>A <b>heat pump</b> — the A/C system running in reverse.</li>
</ul>

<p>Extra parts in a heat pump system: a <b>reversing valve</b> (or a set of shut-off valves) to change the direction of flow, several <b>electronic expansion valves</b>, an inside condenser for heating, and an <b>accumulator</b> that protects the compressor from sucking in liquid. Typical faults: stuck in one mode, an EXV sticking, valve fault codes, refrigerant charge slightly wrong.</p>
<p><b>PTC heater checks</b> (system isolated): HV fuse, resistance of the element compared with the manual, insulation resistance to the case, and its control signal. A PTC heater that has let coolant inside is a classic cause of insulation faults.</p>

<h3>15.9 Coolant</h3>
<ul>
<li>Use only the <b>specified coolant</b>. Battery loops need low-conductivity coolant because it flows close to high-voltage parts.</li>
<li>Never top up with tap water. Minerals raise conductivity and cause corrosion and scale.</li>
<li>These systems trap air easily. Many need a <b>vacuum filling tool</b> and a <b>scan-tool bleed routine</b> that runs the pumps and opens the valves.</li>
<li>A falling coolant level with no visible leak is serious: coolant may be going <b>into</b> the battery pack, motor or chiller.</li>
</ul>

<h3>15.11 When the compressor itself has failed</h3>
<div class="tw"><table>
<thead><tr><th>Failure</th><th>How you find it</th></tr></thead>
<tbody>
<tr><td>Motor winding insulation breakdown</td><td>Insulation tester from the HV pins and the three motor terminals to the housing; low reading</td></tr>
<tr><td>Control board fault (water, burnt parts)</td><td>No communication on LIN/CAN with supplies good; visible corrosion or burning</td></tr>
<tr><td>Scroll seized or worn</td><td>High current then shut-down; noise; metal particles in the oil</td></tr>
</tbody></table></div>
<p><b>Replacing a compressor properly:</b></p>
<ol>
<li>Isolate the HV system and prove dead. Recover the refrigerant.</li>
<li>Inspect the old oil and the drier. If there are metal particles, the debris has travelled through the system.</li>
<li><b>Flush</b> the pipes and heat exchangers if contaminated; replace the expansion valve and the drier or desiccant.</li>
<li>Fit the new compressor with the <b>correct type and quantity of oil</b> (new units are often pre-filled; follow the instructions).</li>
<li>New O-rings, correct torque. Evacuate, vacuum hold test, charge by weight.</li>
<li>Check insulation resistance, clear codes, and verify performance.</li>
</ol>
<p>Skipping the flush and drier is the usual reason a new compressor fails again within weeks.</p>
<aside class="c pk"><h4>In Pakistan</h4><p>Dust, insects and plastic bags block condensers and radiators quickly here. Washing the front heat exchangers gently with water (from the back towards the front, low pressure) and changing the cabin filter are cheap services that directly protect the battery. Many roadside A/C shops share one machine and one oil between all cars; on an EV that can destroy the compressor. In our climate, <b>an EV with a weak A/C is an EV with a battery problem coming.</b></p></aside>

<aside class="c sum"><h4>Summary</h4><ul>
<li>In an EV the A/C cools the battery as well as the cabin, so A/C faults affect charging and power.</li>
<li>Compress → condense → expand → evaporate. High side hot, low side cold.</li>
<li>The electric compressor has a scroll pump, motor and inverter; it is speed-controlled over LIN/CAN and needs many conditions before it runs.</li>
<li>Only insulating POE oil. PAG oil causes insulation faults.</li>
<li>Read both pressures and match the pattern to the cause.</li>
<li>Recover, repair, evacuate, hold, charge by weight, verify. Never "top up".</li>
<li>A heat pump moves heat and is 2–3 times more efficient than a PTC heater.</li>
<li>Use only specified coolant and bleed with the proper procedure.</li></ul></aside>

<template data-m="16" data-part="Part F · Supporting systems" data-title="The 12 V system, networks and software"><section class="mod">
<div class="mh"><div class="n">16</div><div><div class="pt">Part F · Supporting systems</div><h2>The 12 V system, networks and software</h2><p>The low-voltage side: small battery, many computers, and the wires that let them talk.</p></div></div>
<div class="learn"><h4>You will learn</h4><ul>
<li>Why the 12 V battery is critical in an EV</li>
<li>What the main control units do</li>
<li>How CAN bus works and how to check it</li>
<li>Why software and calibration are part of modern repair</li></ul></div>

<h3>16.1 The 12 V battery</h3>
<p>Every EV and hybrid still has a 12 V battery. It powers the computers, lights, locks, wipers and — most importantly — the <b>contactors</b>. If the 12 V battery is flat, the computers cannot wake up and the contactors cannot close. The car is dead, even with a full high-voltage battery.</p>
<aside class="c"><h4>Key idea</h4><p><b>The most common reason an EV or hybrid "will not start" is a weak 12 V battery.</b> Check it first, every time. It is the cheapest and easiest fix in the whole car.</p></aside>
<ul>
<li>The 12 V battery in an EV is small because it never has to crank an engine. It is usually AGM lead-acid; some cars (BYD) use a small 12 V lithium battery.</li>
<li>It is charged by the DC-DC converter only when the car is in READY or charging.</li>
<li>Typical life is 3–5 years; less in heat.</li>
<li><b>Jump-starting:</b> you can normally boost an EV's 12 V battery from another car or a jump pack to wake it up. Do not use an EV to jump-start a petrol car unless the handbook allows it; the starter current can damage the DC-DC converter.</li>
</ul>
<aside class="c pk"><h4>In Pakistan</h4><p>Aftermarket <b>trackers, alarms, dash cameras and LED accessories</b> are fitted to almost every car here. Wired badly, they drain the small 12 V battery while the car is parked, or disturb the data network. When you see a repeated flat 12 V battery or strange electrical faults, look for added wiring first.</p></aside>
<h4>Finding a parked drain</h4>
<p>Connect an ammeter in series with the 12 V negative lead (or use a DC clamp meter). Lock the car and wait 20–30 minutes for the computers to go to sleep. A healthy car draws less than about <b>30–50 mA</b>. If it is higher, pull fuses one at a time until the current drops to find the circuit responsible.</p>

<h3>16.2 Control units</h3>
<div class="tw"><table>
<thead><tr><th>Unit</th><th>Role</th></tr></thead>
<tbody>
<tr><td><b>VCU</b> — vehicle control unit</td><td>The manager. Reads accelerator, brake and gear selector; decides torque; coordinates all the others.</td></tr>
<tr><td><b>BMS</b></td><td>Battery state, limits and protection.</td></tr>
<tr><td><b>MCU</b> — motor control unit (inverter)</td><td>Delivers the torque the VCU asks for.</td></tr>
<tr><td><b>OBC / DC-DC controller</b></td><td>Charging and 12 V supply.</td></tr>
<tr><td><b>TMS / HVAC controller</b></td><td>Pumps, valves, compressor, fans.</td></tr>
<tr><td><b>ABS / ESC / brake controller</b></td><td>Braking, stability, brake blending.</td></tr>
<tr><td><b>EPS</b></td><td>Electric power steering.</td></tr>
<tr><td><b>BCM</b> — body control module</td><td>Lights, locks, windows, wipers.</td></tr>
<tr><td><b>Gateway</b></td><td>Connects the different networks and the diagnostic socket.</td></tr>
</tbody></table></div>

<h3>16.3 CAN bus</h3>
<p>Instead of a separate wire for every signal, control units share a pair of wires called a <b>CAN bus</b> and send each other short digital messages, thousands per second.</p>
<aside class="c pic"><h4>Picture it — the group chat</h4><p>A CAN bus works like a group chat. Every member sees every message. Each message starts with a label saying what it is about ("battery temperature", "wheel speed"), and each control unit simply ignores the ones it does not need. If one member goes silent, the others notice and complain: that is a "lost communication" fault code. If someone shouts nonsense continuously (a short circuit on the wires), nobody can talk at all.</p></aside>
